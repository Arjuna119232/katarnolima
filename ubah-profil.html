<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ubah Profil - KATARNOLIMA RW 05</title>
<link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="style.css?v=36">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{background:#fff!important;width:100%;min-height:100vh;margin:0!important;color:#0f172a}
.page-root{width:100%;max-width:440px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:40px}

/* HEADER */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:50}
.header-left{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;color:#0f172a;text-decoration:none}
.btn-back{width:36px;height:36px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#0f172a}
.btn-simpan{background:transparent;border:none;color:#2563eb;font-weight:700;font-size:15px;cursor:pointer}
.btn-simpan:disabled{color:#94a3b8;cursor:not-allowed}

/* AVATAR SECTION */
.photo-section{text-align:center;padding:24px 16px;background:linear-gradient(180deg,#f8fafc 0%,#fff 100%)}
.avatar-big{width:88px;height:88px;border-radius:50%;border:3px solid #e2e8f0;margin:0 auto;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;color:#fbbf24;font-weight:900;font-size:36px;position:relative}
.avatar-big img{width:100%;height:100%;object-fit:cover}
.ubah-foto-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:#2563eb;font-weight:700;font-size:13px;cursor:pointer;background:none;border:none}

/* FORM SECTION */
.form-section{padding:16px}
.form-group{margin-bottom:20px}
.form-label{font-size:12px;font-weight:600;color:#64748b;margin-bottom:8px;display:block}
.input-wrap{position:relative;display:flex;align-items:center}
.form-input{width:100%;border:none;border-bottom:1.5px solid #cbd5e1;padding:8px 0;font-size:15px;font-weight:600;color:#0f172a;outline:none;background:transparent}
.form-input:focus{border-color:#2563eb}
.form-input.locked{color:#475569;background:transparent}
.input-icon-right{position:absolute;right:0;color:#94a3b8;font-size:16px}

.phone-sub{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.phone-label{font-size:12px;font-weight:600;color:#64748b}
.status-unverified{font-size:11px;font-weight:700;color:#ef4444;display:none}
.status-verified{font-size:11px;font-weight:700;color:#0fb398;display:block}
</style>
</head>
<body>

<div class="page-root">
  <!-- HEADER -->
  <div class="app-header">
    <a href="profil.html" class="header-left">
      <div class="btn-back">←</div>
      <span>Ubah Profil</span>
    </a>
    <button class="btn-simpan" id="btnSimpanProfil">Simpan</button>
  </div>

  <!-- FOTO PROFIL -->
  <div class="photo-section">
    <div class="avatar-big" id="editAvatarInit">W</div>
    <input type="file" id="inputPhotoFile" accept="image/*" style="display:none">
    <button class="ubah-foto-link" id="btnUbahFoto">✏️ Ubah Foto</button>
  </div>

  <!-- INFORMASI DIRI -->
  <div class="form-section">
    <div class="form-group">
      <label class="form-label">Nama Lengkap</label>
      <input type="text" class="form-input" id="inputNamaUbah" placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-wrap">
        <input type="text" class="form-input locked" id="inputUsername" value="Warga_RW05" readonly>
        <span class="input-icon-right">🔒</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <div class="input-wrap">
        <input type="text" class="form-input locked" id="inputEmail" value="" readonly>
        <span class="input-icon-right">🔒</span>
      </div>
    </div>

    <div class="form-group">
      <div class="phone-sub">
        <span class="phone-label">No. Handphone</span>
        <span class="status-unverified" id="phoneStatusText">Belum Terverifikasi</span>
      </div>
      <div class="input-wrap" style="gap: 8px;">
        <input type="tel" class="form-input" id="inputPhone" value="" placeholder="Masukkan nomor handphone (opsional)">
        <button type="button" id="btnVerifyPhone" style="display:none; background:#0fb398; color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap;">Verifikasi</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

var inputNamaUbah = document.getElementById('inputNamaUbah');
var inputEmail = document.getElementById('inputEmail');
var inputUsername = document.getElementById('inputUsername');
var avatarBig = document.getElementById('editAvatarInit');
var inputPhone = document.getElementById('inputPhone');
var phoneStatusText = document.getElementById('phoneStatusText');
var btnVerifyPhone = document.getElementById('btnVerifyPhone');

function updatePhoneUIState(val, verified) {
  const cleanVal = (val || '').trim();
  if (verified) {
    phoneStatusText.textContent = 'Terverifikasi';
    phoneStatusText.className = 'status-verified';
    if(btnVerifyPhone) {
      btnVerifyPhone.style.display = 'block';
      btnVerifyPhone.textContent = 'Sudah Verifikasi';
      btnVerifyPhone.style.background = '#e2e8f0';
      btnVerifyPhone.style.color = '#64748b';
      btnVerifyPhone.disabled = true;
    }
  } else if (cleanVal.length > 0) {
    // Ada isi tapi belum verifikasi (atau belum diklik simpan/verifikasi setelah isi)
    phoneStatusText.style.display = 'block';
    phoneStatusText.textContent = 'Belum Terverifikasi';
    phoneStatusText.className = 'status-unverified';
    if(btnVerifyPhone) {
      btnVerifyPhone.style.display = 'block';
      btnVerifyPhone.textContent = 'Verifikasi';
      btnVerifyPhone.style.background = '#0fb398';
      btnVerifyPhone.style.color = '#fff';
      btnVerifyPhone.disabled = false;
    }
  } else {
    // Kosong: sembunyikan status "Belum Terverifikasi"
    phoneStatusText.style.display = 'none';
    if(btnVerifyPhone) {
      btnVerifyPhone.style.display = 'none';
    }
  }
}

function applyUserData(data) {
  if (!data) return;
  if(inputNamaUbah) inputNamaUbah.value = data.nama || '';
  if(inputEmail) inputEmail.value = data.email || '';
  if(inputUsername) inputUsername.value = (data.nama ? data.nama.replace(/\s+/g, '_') : 'Warga') + '_RW05';
  if(inputPhone) inputPhone.value = data.phone || '';
  
  updatePhoneUIState(data.phone, data.phoneVerified);

  if(avatarBig) {
    if(data.photo) {
      avatarBig.innerHTML = '<img src="' + data.photo + '" alt="Foto">';
    } else {
      avatarBig.textContent = (data.nama || 'W').charAt(0).toUpperCase();
    }
  }
}

// Event handler input phone untuk dinamis menyembunyikan/menampilkan tombol verifikasi
if(inputPhone) {
  inputPhone.addEventListener('input', function() {
    updatePhoneUIState(this.value, false);
  });
}

// Muat instan dari localStorage
var localUser = JSON.parse(localStorage.getItem('rw05_current_user')||'null');
if(localUser) applyUserData(localUser);
else updatePhoneUIState('', false);

// Sinkronisasi real dari Firebase Auth / Firestore profile
onAuthStateChanged(auth, async (user) => {
  if(user) {
    try {
      const snap = await getDoc(doc(db, "users_profile", user.uid));
      let merged = localUser || {};
      merged.email = user.email;
      if(snap.exists()) {
        const d = snap.data();
        merged.nama = d.nama || merged.nama;
        merged.rt = d.rt || merged.rt;
        merged.phone = d.phone || merged.phone;
        merged.phoneVerified = d.phoneVerified || merged.phoneVerified;
        merged.photo = d.photo || merged.photo;
      }
      localStorage.setItem('rw05_current_user', JSON.stringify(merged));
      applyUserData(merged);
    } catch(e) {
      console.error('Gagal sync profile:', e);
    }
  }
});

// Simulasi ubah foto
var btnUbahFoto = document.getElementById('btnUbahFoto');
var inputPhotoFile = document.getElementById('inputPhotoFile');
let tempPhotoBase64 = localUser?.photo || null;

if(btnUbahFoto && inputPhotoFile){
  btnUbahFoto.addEventListener('click', function(){ inputPhotoFile.click(); });
  inputPhotoFile.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      var reader = new FileReader();
      reader.onload = function(evt){
        tempPhotoBase64 = evt.target.result;
        avatarBig.innerHTML = '<img src="' + tempPhotoBase64 + '" alt="Foto">';
      };
      reader.readAsDataURL(e.target.files[0]);
    }
  });
}

// Simulasi verifikasi OTP handphone
if(btnVerifyPhone && inputPhone){
  btnVerifyPhone.addEventListener('click', function(){
    var currentPhoneVal = inputPhone.value.trim();
    if(!currentPhoneVal || currentPhoneVal.length < 9){
      alert('⚠️ Masukkan nomor handphone yang valid terlebih dahulu!');
      return;
    }
    const simulatedOtp = '54321';
    alert(`📲 Simulasi OTP terkirim ke WhatsApp/SMS ${currentPhoneVal}.\n(Kode uji coba Anda: ${simulatedOtp})`);
    var inputOtp = prompt('Masukkan 5 digit kode OTP yang dikirim:');
    if(inputOtp === simulatedOtp){
      updatePhoneUIState(currentPhoneVal, true);

      var currentData = JSON.parse(localStorage.getItem('rw05_current_user')||'{}');
      currentData.phoneVerified = true;
      currentData.phone = currentPhoneVal;
      localStorage.setItem('rw05_current_user', JSON.stringify(currentData));
      alert('✅ Nomor handphone berhasil diverifikasi!');
    } else if(inputOtp !== null) {
      alert('❌ Kode OTP salah!');
    }
  });
}

// Simpan perubahan
var btnSimpan = document.getElementById('btnSimpanProfil');
if(btnSimpan){
  btnSimpan.addEventListener('click', async function(){
    var newNama = inputNamaUbah ? inputNamaUbah.value.trim() : 'Warga';
    var newPhone = inputPhone ? inputPhone.value.trim() : '';
    var newEmail = inputEmail ? inputEmail.value.trim() : '';
    
    if(newNama.length < 3){
      alert('Nama lengkap minimal 3 karakter.');
      return;
    }

    btnSimpan.textContent = 'Menyimpan...';
    btnSimpan.disabled = true;

    try {
      var currentData = JSON.parse(localStorage.getItem('rw05_current_user')||'{}');
      const isVerified = newPhone ? (currentData?.phone === newPhone && currentData?.phoneVerified) : false;
      
      const updatedUser = {
        ...currentData,
        nama: newNama,
        email: newEmail,
        phone: newPhone,
        rt: currentData?.rt || 'RT 03 / RW 05',
        photo: tempPhotoBase64 || currentData?.photo || null,
        phoneVerified: isVerified
      };

      localStorage.setItem('rw05_current_user', JSON.stringify(updatedUser));
      updatePhoneUIState(newPhone, isVerified);

      if(auth.currentUser) {
        try {
          await updateDoc(doc(db, "users_profile", auth.currentUser.uid), {
            nama: newNama,
            phone: newPhone,
            phoneVerified: isVerified,
            photo: tempPhotoBase64 || null
          });
        } catch(e) {
          console.warn('Firestore update non-fatal:', e);
        }
      }

      alert('✅ Profil berhasil disimpan!');
      window.location.href = 'profil.html';
    } catch(err) {
      alert('❌ Gagal menyimpan profil: ' + err.message);
    } finally {
      btnSimpan.textContent = 'Simpan';
      btnSimpan.disabled = false;
    }
  });
}
</script>

</body>
</html>
