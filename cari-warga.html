<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cari Layanan - KATARNOLIMA RW 05</title>
<link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="style.css?v=26">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{background:#fff!important;width:100%;height:100%;display:block!important;margin:0!important}
.cari-page{background:#fff;width:100%;min-height:100vh;max-width:440px;margin:0 auto;display:block}
.cari-header{display:flex;align-items:center;gap:10px;padding:12px 12px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #f1f5f9;width:100%}
.cari-header .back{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;background:#f1f5f9;cursor:pointer}
.cari-bar{flex:1;background:#f1f5f9;border-radius:28px;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid #f1f5f9}
.cari-bar input{border:none;outline:none;width:100%;background:transparent;font-size:14px;color:#0f172a}
.chip-row{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:600;color:#475569;flex-shrink:0;cursor:pointer}
.chip.active{background:#111;color:#fff;border-color:#111}
.result-item{display:flex;gap:14px;padding:14px 16px;align-items:flex-start;cursor:pointer;border-bottom:1px solid #f8fafc}
.result-item:active{background:#f8fafc}
.result-icon{width:48px;height:48px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
</style>
</head>
<body>
<div class="cari-page">
  <div class="cari-header">
    <a href="javascript:void(0)" class="back" id="backBtn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
    <div class="cari-bar"><span>🔍</span><input type="text" id="inputCari" placeholder="Cari Layanan di RW 05" autofocus></div>
  </div>
  <div class="chip-row" id="chipRow">
    <div class="chip active" data-filter="semua">Semua</div>
    <div class="chip" data-filter="laporan">Laporan</div>
    <div class="chip" data-filter="iuran">Iuran</div>
    <div class="chip" data-filter="berita">Berita</div>
    <div class="chip" data-filter="darurat">Darurat</div>
  </div>
  <div id="hasilCari"><div style="padding:16px;color:#94a3b8;font-size:13px">Ketik untuk mencari layanan...</div></div>
</div>
<script>
// @ts-nocheck
const dataLayanan = [
  {k:'Aduan Warga', d:'Lapor masalah di RW 05 jadi mudah', i:'📢', cat:'laporan', link:'aduan-warga.html'},
  {k:'Iuran Warga', d:'Cek tagihan iuran bulanan', i:'💰', cat:'iuran', link:'iuran-warga.html'},
  {k:'Kabar RW', d:'Baca berita resmi yang bebas hoaks', i:'📰', cat:'berita', link:'berita.html'},
  {k:'Kontak Darurat 112', d:'Nomor penting di kala genting', i:'📞', cat:'darurat', link:'tel:112'},
  {k:'Ambulans RW 05', d:'Panggil ambulans 24 jam gratis', i:'🚑', cat:'darurat', link:'https://wa.me/6289673580756?text=Butuh%20Ambulans%20RW05%20DARURAT'},
  {k:'Jadwal Ronda', d:'Jadwal ronda malam RT 01 - RT 06', i:'🛡️', cat:'laporan', link:'#'},
  {k:'Peta Balai RW', d:'Cek lokasi fasilitas RW 05', i:'📍', cat:'berita', link:'https://maps.app.goo.gl/3Xte1yjgYiVT49XK7'},
  {k:'Semua Layanan', d:'Lihat semua layanan RW 05', i:'⊞', cat:'semua', link:'semua-layanan.html'}
];
const inputCari = document.getElementById('inputCari');
const hasilCari = document.getElementById('hasilCari');
const chipRow = document.getElementById('chipRow');
let filterAktif = 'semua';
function renderHasil(query){
  const q = query.toLowerCase().trim();
  let filtered = dataLayanan.filter(function(item){
    const matchQ = item.k.toLowerCase().includes(q) || item.d.toLowerCase().includes(q);
    if(filterAktif !== 'semua'){ return item.cat === filterAktif && (q === '' || matchQ); }
    return q === '' ? true : matchQ;
  });
  if(filtered.length === 0){
    hasilCari.innerHTML = '<div style="padding:40px 16px;text-align:center;color:#94a3b8;font-size:13px">Tidak ada hasil untuk "'+query+'"</div>';
    return;
  }
  hasilCari.innerHTML = filtered.map(function(item){
    return '<a href="'+item.link+'" class="result-item" style="text-decoration:none;color:inherit"><div class="result-icon">'+item.i+'</div><div><h4 style="font-size:14px;font-weight:700;color:#000">'+item.k+'</h4><p style="font-size:12px;color:#64748b;margin-top:3px">'+item.d+'</p></div></a>';
  }).join('');
}
inputCari.addEventListener('input', function(){ renderHasil(this.value); });
chipRow.addEventListener('click', function(e){
  if(e.target.classList.contains('chip')){
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
    e.target.classList.add('active');
    filterAktif = e.target.getAttribute('data-filter');
    renderHasil(inputCari.value);
  }
});
renderHasil('');
document.getElementById('backBtn').addEventListener('click', function(e){
  e.preventDefault();
  if(window.history.length > 1){ window.history.back(); } else { window.location.href='index.html'; }
});
</script>
</body>
</html>
