<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detail Berita - KATARNOLIMA RW 05</title>
    <link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f5f5f5; color: #10131a; line-height: 1.6; }
        .mobile-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; padding-bottom: 40px; box-shadow: 0 0 15px rgba(0,0,0,0.06); }
        .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); z-index: 50; border-bottom: 1px solid #eee; }
        .back-btn { font-size: 20px; text-decoration: none; color: #10131a; font-weight: 700; }
        .brand-badge { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; background: #0f172a; color: #fbbf24; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; }
        .content-body { padding: 20px 16px; }
        .kicker { font-size: 11px; font-weight: 800; color: #2563eb; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
        .title { font-size: 22px; font-weight: 800; line-height: 1.25; color: #10131a; margin-bottom: 12px; }
        .meta-info { font-size: 12px; color: #64748b; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; display: flex; flex-wrap: wrap; gap: 8px; }
        .article-image { width: 100%; max-height: 320px; object-fit: cover; border-radius: 14px; margin-bottom: 18px; border: 1px solid #e2e8f0; }
        .article-content { font-size: 14px; color: #333; white-space: pre-line; word-break: break-word; }
        .loading-state, .error-state { text-align: center; padding: 40px 20px; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header-nav">
        <a href="berita-rw.html" class="back-btn">←</a>
        <div class="brand-badge">KATARNOLIMA RW 05</div>
    </div>

    <div class="content-body" id="article-container">
        <div class="loading-state">Memuat artikel...</div>
    </div>
</div>

<script type="module">
// @ts-nocheck
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadArticleDetail() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('article-container');

    if (!id) {
        container.innerHTML = `<div class="error-state">ID Artikel tidak ditemukan. <br><a href="berita-rw.html" style="color:#2563eb;font-weight:700;">Kembali ke Berita RW</a></div>`;
        return;
    }

    try {
        const docRef = doc(db, "berita_rw05", id);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
            container.innerHTML = `<div class="error-state">Artikel tidak ditemukan atau sudah dihapus oleh admin. <br><a href="berita-rw.html" style="color:#2563eb;font-weight:700;margin-top:8px;display:inline-block;">Kembali ke Berita RW</a></div>`;
            return;
        }

        const d = docSnap.data();
        document.title = `${d.judul || 'Detail'} - KATARNOLIMA RW 05`;

        const imageHtml = d.fotoBase64 ? `<img src="${d.fotoBase64}" class="article-image" alt="Dokumentasi Berita">` : '';
        const ikonKat = d.ikon || '🌸';
        const katLabel = d.kategoriLabel || 'Informasi Warga';

        container.innerHTML = `
            <div class="kicker">${ikonKat} ${katLabel}</div>
            <h1 class="title">${d.judul || 'Tanpa Judul'}</h1>
            <div class="meta-info">
                <span>📅 ${d.tanggal || '-'}</span>
                ${d.lokasi ? `<span>📍 ${d.lokasi}</span>` : ''}
                <span>✍️ ${d.penulis || 'Pengurus RW 05'}</span>
            </div>
            ${imageHtml}
            <div class="article-content">${d.isi || 'Tidak ada konten.'}</div>
            
            <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid #eee; text-align: center;">
                <a href="berita-rw.html" style="display: inline-block; background: #0f172a; color: #fbbf24; font-size: 12px; font-weight: 800; padding: 10px 20px; border-radius: 999px; text-decoration: none;">← Kembali ke Daftar Berita</a>
            </div>
        `;
    } catch (error) {
        console.error("Gagal memuat detail berita:", error);
        container.innerHTML = `<div class="error-state">Gagal memuat artikel. Periksa koneksi internet Anda.</div>`;
    }
}

document.addEventListener('DOMContentLoaded', loadArticleDetail);
</script>

</body>
</html>
