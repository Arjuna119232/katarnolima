<html lang="id">
<!DOCTYPE html>
<head>
<script src="../assets/js/core/theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0f1a">
<title>Cari Layanan - KATARNOLIMA RW 05</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base/theme.css">
<link rel="stylesheet" href="../assets/css/base/global.css?v=26">
<link rel="stylesheet" href="../assets/css/pages/cari-warga.css">
</head>
<body>

<div class="cari-page">
  <!-- HEADER & SEARCH BAR -->
  <div class="cari-header">
    <a href="javascript:void(0)" class="back" id="backBtn" title="Kembali">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="cari-bar">
      <span style="font-size:14px;">🔍</span>
      <input type="text" id="inputCari" placeholder="Cari Layanan di RW 05..." autofocus autocomplete="off">
      <button type="button" class="btn-clear-input" id="btnClearInput">✕</button>
    </div>
  </div>

  <!-- FILTER CHIPS -->
  <div class="chip-row" id="chipRow">
    <div class="chip active" data-filter="semua">Semua</div>
    <div class="chip" data-filter="laporan">Laporan</div>
    <div class="chip" data-filter="iuran">Iuran</div>
    <div class="chip" data-filter="berita">Berita</div>
    <div class="chip" data-filter="darurat">Darurat</div>
    <div class="chip" data-filter="fasilitas">Fasilitas</div>
    <div class="chip" data-filter="profil">Profil & Akun</div>
  </div>

  <!-- HASIL PENCARIAN -->
  <div class="results-container" id="hasilCari">
    <div class="state-box">
      <span class="state-icon">🔎</span>
      <div class="state-title">Cari Layanan RW 05</div>
      <div class="state-desc">Ketik nama layanan, aduan, atau informasi yang Anda butuhkan di atas.</div>
    </div>
  </div>
</div>

<script src="../assets/js/pages/cari-warga.ui.js"></script>
<script src="../assets/js/core/theme.js"></script>
</body>
</html>
