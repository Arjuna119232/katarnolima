<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notifikasi RW 05 - KATARNOLIMA</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="../assets/css/style.css?v=33">
<style>
/* RESET & BASE SYSTEM */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent !important;
  outline: none !important;
}

body {
  background: #f8fafc !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #0f172a;
  line-height: 1.5;
}

.info-container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
  padding-bottom: 110px;
  box-shadow: 0 0 30px rgba(15, 23, 42, 0.05);
  position: relative;
}

/* HEADER NOTIFIKASI STICKY */
.light-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid #f1f5f9;
}

.light-header h1 {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.2px;
}

.header-actions {
  position: relative;
}

.btn-menu-dot {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  font-size: 18px;
  color: #475569;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
}
.btn-menu-dot:active { transform: scale(0.92); }

.popover-menu {
  position: absolute;
  top: 44px;
  right: 0;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
  border: 1px solid #e2e8f0;
  padding: 6px;
  display: none;
  min-width: 170px;
  z-index: 40;
}
.popover-menu.show { display: block; }

.popover-item {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 700;
  color: #0f172a;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s ease;
}
.popover-item:hover { background: #f1f5f9; }

/* LIST NOTIFIKASI ITEMS */
.notif-list {
  display: flex;
  flex-direction: column;
}

.notif-item {
  display: flex;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid #f1f5f9;
  background: #fffbeb;
  cursor: pointer;
  transition: background-color 0.2s ease;
}
.notif-item:active { transform: scale(0.99); }
.notif-item.read { background: #ffffff; }

.notif-avatar {
  width: 40px;
  height: 40px;
  background: #0f172a;
  color: #fbbf24;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
  position: relative;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
}

.notif-dot {
  width: 9px;
  height: 9px;
  background: #22c55e;
  border-radius: 50%;
  position: absolute;
  top: -2px;
  right: -2px;
  border: 2px solid #ffffff;
}
.notif-item.read .notif-dot { display: none; }

.notif-main {
  flex: 1;
  min-width: 0;
}

.notif-sender-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
}

.notif-sender {
  font-size: 12px;
  font-weight: 800;
  color: #0f172a;
}

.notif-time {
  font-size: 10px;
  color: #94a3b8;
  font-weight: 600;
}

.notif-text {
  font-size: 12px;
  color: #475569;
  line-height: 1.4;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.notif-title-inline {
  font-weight: 800;
  color: #0f172a;
}

/* MODAL DETAIL NOTIFIKASI */
#notif-detail-modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#notif-detail-modal.show { display: flex; opacity: 1; }

.modal-notif-box {
  background: #ffffff;
  width: 100%;
  max-width: 380px;
  border-radius: 24px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
  overflow: hidden;
  transform: scale(0.9);
  transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#notif-detail-modal.show .modal-notif-box { transform: scale(1); }

/* STATE STATE EMPTY / LOADING */
.state-box {
  text-align: center;
  padding: 50px 20px;
  color: #64748b;
  font-size: 12px;
  font-weight: 600;
}
.state-icon { font-size: 36px; margin-bottom: 8px; display: block; }
</style>
</head>
<body>

<div class="info-container">
  <!-- HEADER NOTIFIKASI -->
  <div class="light-header">
    <h1>Notifikasi</h1>
    <div class="header-actions">
      <button class="btn-menu-dot" id="btnMenuDot" aria-label="Menu Opsi">⋮</button>
      <div class="popover-menu" id="popoverMenu">
        <button class="popover-item" id="btnMarkAllRead">
          <span>✓</span> Tandai semua telah dibaca
        </button>
      </div>
    </div>
  </div>

  <!-- CONTAINER LIST NOTIFIKASI -->
  <div id="loadingNotif" class="state-box">
    <span class="state-icon">🔄</span>
    Memuat pemberitahuan admin...
  </div>
  <div class="notif-list" id="notifList"></div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="jaki-nav">
    <a href="../index.html">🏠<span>Beranda</span></a>
    <a href="diskusi-rw.html">💬<span>Diskusi</span></a>
    <a class="center" href="aduan-warga.html?autoOpen=1"><div class="cam">📷</div><span>Lapor</span></a>
    <a class="active" href="info.html">🔔<span>Notifikasi</span></a>
    <a href="profil.html">👤<span>Profil</span></a>
  </nav>
</div>

<!-- MODAL DETAIL POPUP NOTIFIKASI -->
<div id="notif-detail-modal">
  <div class="modal-notif-box">
    <div style="padding:16px 20px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;">
      <h3 id="modalDetailTitle" style="font-size:15px; font-weight:800; color:#0f172a;">Detail Notifikasi</h3>
      <button onclick="closeNotifDetailModal()" style="background:#f1f5f9; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
    </div>
    <div id="modalDetailBody" style="padding:20px; font-size:13px; color:#334155; line-height:1.6; white-space:pre-line; max-height:60vh; overflow-y:auto;"></div>
  </div>
</div>

<script src="../assets/js/script.js?v=27"></script>
<script type="module">
  // @ts-nocheck
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
    authDomain: "katarnolima-rw05.firebaseapp.com",
    projectId: "katarnolima-rw05",
    storageBucket: "katarnolima-rw05.firebasestorage.app",
    messagingSenderId: "965647612835",
    appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const notifList = document.getElementById('notifList');
  const loadingNotif = document.getElementById('loadingNotif');
  const btnMenuDot = document.getElementById('btnMenuDot');
  const popoverMenu = document.getElementById('popoverMenu');
  const btnMarkAllRead = document.getElementById('btnMarkAllRead');

  function getReadIds() {
    try {
      return JSON.parse(localStorage.getItem('rw05_read_notifs') || '[]');
    } catch {
      return [];
    }
  }

  function saveReadId(id) {
    const list = getReadIds();
    if (!list.includes(id)) {
      list.push(id);
      localStorage.setItem('rw05_read_notifs', JSON.stringify(list));
    }
  }

  function markAllReadIds(ids) {
    const list = getReadIds();
    ids.forEach(id => { if (!list.includes(id)) list.push(id); });
    localStorage.setItem('rw05_read_notifs', JSON.stringify(list));
  }

  if (btnMenuDot && popoverMenu) {
    btnMenuDot.addEventListener('click', (e) => {
      e.stopPropagation();
      popoverMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => {
      popoverMenu.classList.remove('show');
    });
  }

  if (btnMarkAllRead) {
    btnMarkAllRead.addEventListener('click', () => {
      const allIds = Array.from(document.querySelectorAll('.notif-item')).map(el => el.dataset.id).filter(Boolean);
      markAllReadIds(allIds);
      document.querySelectorAll('.notif-item').forEach(el => el.classList.add('read'));
      if (popoverMenu) popoverMenu.classList.remove('show');
    });
  }

  window.openNotifDetail = function(el, title, content, timeStr) {
    el.classList.add('read');
    const id = el.getAttribute('data-id');
    if (id) saveReadId(id);

    const modal = document.getElementById('notif-detail-modal');
    const titleEl = document.getElementById('modalDetailTitle');
    const bodyEl = document.getElementById('modalDetailBody');
    if (titleEl) titleEl.textContent = title || 'Detail Notifikasi';
    if (bodyEl) bodyEl.innerHTML = `<div style="font-size:11px; font-weight:700; color:#64748b; margin-bottom:12px;">🕒 ${timeStr}</div>${escapeHtml(content)}`;
    if (modal) {
      modal.classList.add('show');
      window.history.pushState({ modalOpen: true }, '', window.location.href);
    }
  };

  window.closeNotifDetailModal = function(shouldPopHistory = true) {
    const modal = document.getElementById('notif-detail-modal');
    if (modal && modal.classList.contains('show')) {
      modal.classList.remove('show');
      if (shouldPopHistory && window.history.state && window.history.state.modalOpen) {
        window.history.back();
      }
    }
  };

  function escapeHtml(str = '') {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }

  onSnapshot(query(collection(db, "info_singkat"), orderBy("createdAt", "desc")), (snap) => {
    if (loadingNotif) loadingNotif.style.display = 'none';
    if (snap.empty) {
      if (notifList) {
        notifList.innerHTML = `
          <div class="state-box">
            <span class="state-icon">🔔</span>
            <div style="font-weight:800; color:#0f172a; margin-bottom:4px;">Belum Ada Notifikasi</div>
            <p>Belum ada pengumuman atau pemberitahuan dari Admin RW 05 saat ini.</p>
          </div>
        `;
      }
      return;
    }

    const readList = getReadIds();
    let html = '';

    snap.forEach((docItem) => {
      const id = docItem.id;
      const isRead = readList.includes(id);
      const d = docItem.data() || {};
      const timeStr = d.tanggal || 'Baru saja';
      const title = d.judul || 'Informasi RW';
      const content = d.isi || '';
      const iconBadge = d.ikon || '05';
      
      const safeTitle = JSON.stringify(title).replace(/"/g, '&quot;');
      const safeContent = JSON.stringify(content).replace(/"/g, '&quot;');
      const cleanContentInline = escapeHtml(content.replace(/\n/g, ' '));
      
      html += `
        <div class="notif-item ${isRead ? 'read' : ''}" data-id="${id}" onclick="openNotifDetail(this, ${safeTitle}, ${safeContent}, '${timeStr}')">
          <div class="notif-avatar">
            ${iconBadge.length <= 2 ? iconBadge : '🔔'}
            <div class="notif-dot"></div>
          </div>
          <div class="notif-main">
            <div class="notif-sender-row">
              <span class="notif-sender">KATARNOLIMA / Admin RW 05</span>
              <span class="notif-time">${timeStr}</span>
            </div>
            <div class="notif-text">
              <span class="notif-title-inline">${escapeHtml(title)} - </span><span>${cleanContentInline}</span>
            </div>
          </div>
        </div>
      `;
    });

    if (notifList) notifList.innerHTML = html;
  }, (err) => {
    console.error("Gagal load notifikasi:", err);
    if (loadingNotif) {
      loadingNotif.innerHTML = `
        <div class="state-box">
          <span class="state-icon">❌</span>
          <div style="font-weight:800; color:#0f172a; margin-bottom:4px;">Gagal Memuat Notifikasi</div>
          <p>Periksa koneksi internet Anda.</p>
        </div>
      `;
    }
  });

  const uniModalDetail = document.getElementById('notif-detail-modal');
  if (uniModalDetail) {
    uniModalDetail.addEventListener('click', (e) => {
      if (e.target === uniModalDetail) closeNotifDetailModal(true);
    });
  }
</script>

<script>
// --- PENANGANAN NAVIGASI BACK SISTEM HP AGAR MENDORONG KE INDEX.HTML ---
function goToIndex() {
  window.location.href = '../index.html';
}

// Menyiapkan history state saat halaman pertama kali dibuka
window.history.pushState({ page: 'info' }, '', window.location.href);

// Menangkap event gesture/tombol back HP
window.addEventListener('popstate', function(e) {
  const modal = document.getElementById('notif-detail-modal');
  
  // Jika modal detail sedang terbuka, tutup modalnya terlebih dahulu
  if (modal && modal.classList.contains('show')) {
    closeNotifDetailModal(false);
    return;
  }
  
  // Jika tidak ada modal terbuka, dorong halaman kembali ke Beranda (index.html)
  goToIndex();
});
</script>
</body>
</html>
