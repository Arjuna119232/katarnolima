<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iuran Warga - RW 05 LIVE</title>
<link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="style.css?v=26">
<style>
*{ -webkit-tap-highlight-color:transparent!important; margin:0; padding:0; box-sizing:border-box; }
body { background: #f8fafc !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.container { width: 100%; max-width: 440px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 16px; padding-bottom: 120px; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.btn-back { width: 40px; height: 40px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
.saldo-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
.saldo-val { font-size: 28px; font-weight: 900; color: #0f172a; margin-top: 4px; }

/* REKENING & QRIS BOX */
.qris-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 16px; }
.qris-img { width: 180px; height: 180px; object-fit: contain; border-radius: 8px; margin: 8px 0; border: 1px solid #e2e8f0; }
.rekeing-info { font-size: 12px; color: #334155; line-height: 1.5; font-weight: 600; }

/* FORM INPUT */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
.input-custom { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; outline: none; }
.input-custom:focus { border-color: #2563eb; }
.btn-submit { width: 100%; padding: 14px; background: #111; color: #fbbf24; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 8px; }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="btn-back" onclick="history.back()">⬅️</div>
    <h2 style="font-size:16px;font-weight:800;color:#0f172a">Iuran Warga RW 05</h2>
  </div>

  <!-- SALDO KAS -->
  <div class="card">
    <div class="saldo-title">SALDO KAS RW 05 (LIVE)</div>
    <div class="saldo-val" id="saldoVal">Rp 0</div>
  </div>

  <!-- METODE PEMBAYARAN (QRIS / TRANSFER) -->
  <div class="card">
    <h3 style="font-size:13px;font-weight:800;color:#0f172a;margin-bottom:8px">💳 Metode Pembayaran</h3>
    <div class="qris-box">
      <p class="rekeing-info">Scan QRIS / Transfer Bank RW 05</p>
      <img src="../assets/img/qris-rw05.jpg" alt="QRIS RW 05" class="qris-img" id="qrisImg">
      <div class="rekeing-info">
        <b>Bank DKI / BCA:</b> 1234-5678-90<br>
        a.n. <b>Kas Karang Taruna RW 05</b>
      </div>
    </div>
  </div>

  <!-- FORM BAYAR -->
  <div class="card">
    <h3 style="font-size:13px;font-weight:800;color:#0f172a;margin-bottom:12px">📝 Form Pembayaran Iuran</h3>
    <form id="formIuran">
      <div class="form-group">
        <label>NIK (16 Digit)</label>
        <input type="number" id="nik" class="input-custom" placeholder="Masukkan 16 digit NIK" required>
      </div>

      <div class="form-group">
        <label>Bulan Pembayaran</label>
        <select id="bulan" class="input-custom" required>
          <option value="September 2026">September 2026</option>
          <option value="Oktober 2026">Oktober 2026</option>
          <option value="November 2026">November 2026</option>
          <option value="Desember 2026">Desember 2026</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nominal Pembayaran (Rp)</label>
        <input type="number" id="nominal" class="input-custom" placeholder="Contoh: 50000" required>
      </div>

      <div class="form-group">
        <label>RT</label>
        <select id="rt" class="input-custom" required>
          <option value="RT 01">RT 01</option>
          <option value="RT 02">RT 02</option>
          <option value="RT 03">RT 03</option>
          <option value="RT 04">RT 04</option>
          <option value="RT 05">RT 05</option>
          <option value="RT 06">RT 06</option>
          <option value="RT 07">RT 07</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload Bukti Transfer / QRIS</label>
        <input type="file" id="bukti" class="input-custom" accept="image/*" required>
      </div>

      <button type="submit" id="btnBayar" class="btn-submit">Bayar Sekarang</button>
    </form>
  </div>
</div>

<script src="script.js?v=26"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FALLBACK GAMBAR JIKA QRIS BELUM TERSEDIA
const imgEl = document.getElementById('qrisImg');
if (imgEl) {
  imgEl.addEventListener('error', function() {
    this.src = 'https://via.placeholder.com/180?text=QRIS+RW+05';
  });
}

// 1. LISTEN SALDO LIVE FIRESTORE
const saldoRef = doc(db, "kas_rw05", "saldo_utama");

onSnapshot(saldoRef, 
  /** @param {any} snap */
  (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      const total = data ? data.total || 0 : 0;
      const saldoEl = document.getElementById('saldoVal');
      if (saldoEl) saldoEl.textContent = "Rp " + total.toLocaleString('id-ID');
    }
  }
);

// 2. LOGIKA TRANSAKSI PEMBAYARAN IURAN
const form = document.getElementById('formIuran');
if (form) {
  form.addEventListener('submit', 
    /** @param {any} e */
    async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnBayar');
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Memproses Pembayaran...";
      }

      const nikEl = document.getElementById('nik');
      const bulanEl = document.getElementById('bulan');
      const nominalEl = document.getElementById('nominal');
      const rtEl = document.getElementById('rt');

      const nik = nikEl ? nikEl.value : '';
      const bulan = bulanEl ? bulanEl.value : '';
      const nominal = nominalEl ? parseInt(nominalEl.value) || 0 : 0;
      const rt = rtEl ? rtEl.value : '';

      try {
        await runTransaction(db, 
          /** @param {any} transaction */
          async (transaction) => {
            const sfDoc = await transaction.get(saldoRef);
            if (!sfDoc.exists()) {
              transaction.set(saldoRef, { total: nominal });
            } else {
              const oldData = sfDoc.data();
              const newTotal = (oldData ? oldData.total || 0 : 0) + nominal;
              transaction.update(saldoRef, { total: newTotal, updatedAt: serverTimestamp() });
            }
          }
        );

        await addDoc(collection(db, "riwayat_iuran"), {
          nik: nik,
          bulan: bulan,
          nominal: nominal,
          rt: rt,
          createdAt: serverTimestamp()
        });

        alert("✅ Pembayaran iuran berhasil disimpan dan saldo kas live telah di-update!");
        form.reset();

      } catch (err) {
        console.error("Gagal simpan:", err);
        alert("❌ Terjadi kesalahan saat memproses pembayaran.");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Bayar Sekarang";
        }
      }
    }
  );
}
</script>
</body>
</html>
