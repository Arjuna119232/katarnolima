<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iuran Warga - KATARNOLIMA RW 05</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="../assets/css/style.css?v=26">
<style>
/* RESET & SYSTEM BASE */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  outline: none !important;
}

body {
  background: #f8fafc !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #0f172a;
  line-height: 1.5;
}

.container {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
  padding: 16px 20px 40px;
  box-shadow: 0 0 30px rgba(15, 23, 42, 0.05);
  position: relative;
}

/* STICKY HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f1f5f9;
}

.btn-back {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: #0f172a;
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease;
  text-decoration: none;
}
.btn-back:active { transform: scale(0.92); }

/* KARTU SALDO GRADIENT */
.card-saldo {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  border-radius: 20px;
  padding: 20px;
  color: #ffffff;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
  position: relative;
  overflow: hidden;
}
.card-saldo::after {
  content: "💳";
  position: absolute;
  right: -10px;
  bottom: -15px;
  font-size: 90px;
  opacity: 0.08;
  pointer-events: none;
}
.saldo-title {
  font-size: 11px;
  font-weight: 800;
  color: #fbbf24;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.saldo-val {
  font-size: 28px;
  font-weight: 800;
  color: #ffffff;
  margin-top: 6px;
  letter-spacing: -0.5px;
}

/* CARDS COMMON */
.card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 20px;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.02);
}
.card-subtitle {
  font-size: 14px;
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 14px;
  letter-spacing: -0.2px;
}

/* REKENING & QRIS BOX */
.qris-box {
  background: #f8fafc;
  border: 1.5px dashed #cbd5e1;
  border-radius: 16px;
  padding: 16px;
  text-align: center;
}
.qris-img {
  width: 170px;
  height: 170px;
  object-fit: contain;
  border-radius: 12px;
  margin: 10px 0;
  border: 1px solid #e2e8f0;
  background: #ffffff;
}
.rekening-info {
  font-size: 12px;
  color: #334155;
  line-height: 1.5;
  font-weight: 600;
}
.btn-copy {
  margin-top: 8px;
  padding: 6px 14px;
  background: #eff6ff;
  color: #2563eb;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

/* FORM STYLING */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  color: #475569;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.input-custom {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 14px;
  font-size: 13px;
  outline: none;
  background: #f8fafc;
  color: #0f172a;
  transition: all 0.2s ease;
}
.input-custom:focus {
  border-color: #0f172a;
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
}

/* PREVIEW BUKTI TRANSFER */
.upload-wrapper { position: relative; }
.preview-box {
  display: none;
  margin-top: 10px;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #cbd5e1;
  background: #0f172a;
  text-align: center;
}
.preview-img {
  width: 100%;
  max-height: 180px;
  object-fit: contain;
}
.btn-remove-file {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #ef4444;
  color: #ffffff;
  border: 2px solid #ffffff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.btn-submit {
  width: 100%;
  padding: 14px;
  background: #0f172a;
  color: #fbbf24;
  border: none;
  border-radius: 14px;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
  transition: transform 0.15s ease;
}
.btn-submit:active { transform: scale(0.97); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <a href="javascript:void(0)" class="btn-back" onclick="goToIndex()">←</a>
    <h1 style="font-size:16px; font-weight:800; color:#0f172a; letter-spacing:-0.2px;">Iuran Warga RW 05</h1>
  </div>

  <!-- SALDO KAS CARD -->
  <div class="card-saldo">
    <div class="saldo-title"><span>🔴</span> SALDO KAS RW 05 (LIVE)</div>
    <div class="saldo-val" id="saldoVal">Rp 0</div>
  </div>

  <!-- METODE PEMBAYARAN -->
  <div class="card">
    <div class="card-subtitle">💳 Metode Pembayaran Transfer / QRIS</div>
    <div class="qris-box">
      <p class="rekening-info">Scan QRIS / Transfer Bank Resmi RW 05</p>
      <img src="../assets/img/qris-rw05.jpg" alt="QRIS RW 05" class="qris-img" id="qrisImg">
      <div class="rekening-info">
        <b>Bank BCA / DKI:</b> <span id="rekNum">1234-5678-90</span><br>
        a.n. <b>Kas Karang Taruna RW 05</b>
      </div>
      <button type="button" class="btn-copy" onclick="salinRekening()">📋 Salin No. Rekening</button>
    </div>
  </div>

  <!-- FORM PEMBAYARAN -->
  <div class="card">
    <div class="card-subtitle">📝 Form Pengiriman Bukti Iuran</div>
    <form id="formIuran">
      <div class="form-group">
        <label>NIK (16 Digit Sesuai KTP)</label>
        <input type="text" id="nik" class="input-custom" maxlength="16" placeholder="Masukkan 16 digit NIK" required oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      </div>

      <div class="form-group">
        <label>Bulan Pembayaran</label>
        <input type="text" id="bulan" class="input-custom" placeholder="Contoh: September 2026" required>
      </div>

      <div class="form-group">
        <label>Nominal Pembayaran (Rp)</label>
        <input type="number" id="nominal" class="input-custom" placeholder="Contoh: 50000" required>
      </div>

      <div class="form-group">
        <label>Wilayah RT Tempat Tinggal</label>
        <select id="rt" class="input-custom" required>
          <option value="" disabled selected>-- Pilih RT --</option>
          <option value="RT 01">RT 01</option>
          <option value="RT 02">RT 02</option>
          <option value="RT 03">RT 03</option>
          <option value="RT 04">RT 04</option>
          <option value="RT 05">RT 05</option>
          <option value="RT 06">RT 06</option>
          <option value="RT 07">RT 07</option>
          <option value="RT 08">RT 08</option>
          <option value="RT 09">RT 09</option>
          <option value="RT 10">RT 10</option>
          <option value="RT 11">RT 11</option>
          <option value="RT 12">RT 12</option>
          <option value="RT 13">RT 13</option>
          <option value="RT 14">RT 14</option>
          <option value="RT 15">RT 15</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload Bukti Transfer / QRIS</label>
        <div class="upload-wrapper">
          <input type="file" id="bukti" class="input-custom" accept="image/*" required>
          <div class="preview-box" id="previewContainer">
            <img id="previewImage" class="preview-img" alt="Bukti Transfer">
            <button type="button" class="btn-remove-file" onclick="hapusBuktiTransfer()" title="Hapus foto">✕</button>
          </div>
        </div>
      </div>

      <button type="submit" id="btnBayar" class="btn-submit">Kirim Bukti Pembayaran</button>
    </form>
  </div>
</div>

<script src="../assets/js/script.js?v=26"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FALLBACK QRIS IMAGE
const imgEl = document.getElementById('qrisImg');
if (imgEl) {
  imgEl.addEventListener('error', function() {
    this.src = 'https://via.placeholder.com/170?text=QRIS+RW+05';
  });
}

window.salinRekening = function() {
  const rekText = document.getElementById('rekNum')?.textContent || '1234567890';
  navigator.clipboard.writeText(rekText.replace(/-/g, ''));
  alert("✅ Nomor rekening berhasil disalin!");
};

// KOMPRESI GAMBAR OTOMATIS
function compressImage(file, maxWidth = 600, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

// LOGIKA UPLOAD & PREVIEW BUKTI TRANSFER
const buktiInput = document.getElementById('bukti');
const previewContainer = document.getElementById('previewContainer');
const previewImage = document.getElementById('previewImage');
let base64Bukti = "";

if (buktiInput) {
  buktiInput.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (file) {
      try {
        base64Bukti = await compressImage(file, 600, 0.6);
        previewImage.src = base64Bukti;
        previewContainer.style.display = 'block';
      } catch (err) {
        alert("⚠️ Gagal memproses gambar bukti transfer.");
      }
    }
  });
}

window.hapusBuktiTransfer = function() {
  if (buktiInput) buktiInput.value = "";
  base64Bukti = "";
  if (previewContainer) previewContainer.style.display = 'none';
  if (previewImage) previewImage.src = "";
};

// LISTEN SALDO LIVE FIRESTORE
const saldoRef = doc(db, "kas_rw05", "saldo_utama");
onSnapshot(saldoRef, (snap) => {
  if (snap.exists()) {
    const data = snap.data();
    const total = data ? data.total || 0 : 0;
    const saldoEl = document.getElementById('saldoVal');
    if (saldoEl) saldoEl.textContent = "Rp " + total.toLocaleString('id-ID');
  }
});

// SUBMIT FORM PEMBAYARAN
const form = document.getElementById('formIuran');
if (form) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nikEl = document.getElementById('nik');
    const bulanEl = document.getElementById('bulan');
    const nominalEl = document.getElementById('nominal');
    const rtEl = document.getElementById('rt');

    const nik = nikEl ? nikEl.value.trim() : '';
    const bulan = bulanEl ? bulanEl.value.trim() : '';
    const nominal = nominalEl ? parseInt(nominalEl.value) || 0 : 0;
    const rt = rtEl ? rtEl.value : '';

    if (nik.length !== 16) {
      alert("⚠️ NIK harus berjumlah tepat 16 digit!");
      if (nikEl) nikEl.focus();
      return;
    }

    if (!base64Bukti) {
      alert("⚠️ Silakan unggah foto bukti transfer terlebih dahulu.");
      return;
    }

    const btn = document.getElementById('btnBayar');
    if (btn) {
      btn.disabled = true;
      btn.textContent = "⏳ Memproses Pembayaran...";
    }

    try {
      // 1. UPDATE SALDO KAS
      const sfDoc = await getDoc(saldoRef);
      let newTotal = nominal;
      if (sfDoc.exists()) {
        const oldData = sfDoc.data();
        newTotal = (oldData ? oldData.total || 0 : 0) + nominal;
      }
      await setDoc(saldoRef, { total: newTotal, updatedAt: serverTimestamp() }, { merge: true });

      // 2. SIMPAN DOKUMEN TRANSAKSI KE COLLECTION "iuran_warga_rw05"
      await addDoc(collection(db, "iuran_warga_rw05"), {
        nik: nik,
        bulan: bulan,
        nominal: nominal,
        rt: rt,
        buktiUrl: base64Bukti,
        status: "Berhasil",
        createdAt: serverTimestamp()
      });

      alert("✅ Pembayaran iuran berhasil dikirim! Data sudah terverifikasi.");
      form.reset();
      window.hapusBuktiTransfer();

    } catch (err) {
      console.error("Gagal simpan:", err);
      alert("❌ Terjadi kesalahan saat memproses pembayaran:\n" + (err.message || err));
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = "Kirim Bukti Pembayaran";
      }
    }
  });
}
</script>

<script>
// --- PENANGANAN NAVIGASI BACK SISTEM HP AGAR MENDORONG KE INDEX.HTML ---
function goToIndex() {
  window.location.href = '../index.html';
}

// Menyiapkan history state saat halaman dibuka
window.history.pushState({ page: 'iuran-warga' }, '', window.location.href);

// Menangkap event gesture / tombol back HP
window.addEventListener('popstate', function(e) {
  goToIndex();
});
</script>
</body>
</html>
