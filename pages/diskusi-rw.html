<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forum Diskusi Warga - KATARNOLIMA RW 05</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="../assets/css/style.css?v=27">
<style>
  /* RESET & BASE SYSTEM */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
  }
  body {
    background: #f8fafc;
    color: #0f172a;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app-container {
    width: 100%;
    max-width: 440px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    box-shadow: 0 0 30px rgba(15, 23, 42, 0.05);
  }
  
  /* STICKY HEADER */
  .header-app {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .btn-back {
    text-decoration: none;
    color: #0f172a;
    font-size: 18px;
    font-weight: 800;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    transition: transform 0.15s ease;
  }
  .btn-back:active { transform: scale(0.92); }
  .header-title h1 { font-size: 15px; font-weight: 800; line-height: 1.2; letter-spacing: -0.2px; }
  .header-title p { font-size: 11px; color: #64748b; font-weight: 600; margin-top: 1px; }

  /* SWITCH ROLE KHUSUS ADMIN */
  .admin-switch-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    background: #0f172a;
    padding: 4px 10px;
    border-radius: 99px;
    color: #fff;
  }
  .admin-switch-wrap span { font-size: 9px; font-weight: 800; color: #fbbf24; text-transform: uppercase; }
  .switch-toggle { position: relative; display: inline-block; width: 34px; height: 18px; flex-shrink: 0; }
  .switch-toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .3s; border-radius: 18px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: #22c55e; }
  input:checked + .slider:before { transform: translateX(16px); }

  /* BADGE LIMIT UNTUK WARGA */
  .limit-badge-warga {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fef3c7;
    color: #b45309;
    font-size: 10px;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 10px;
    border: 1px solid #fde68a;
  }

  /* CHAT AREA & MESSAGES */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f8fafc;
  }
  
  .date-separator {
    align-self: center;
    background: #e2e8f0;
    color: #475569;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 99px;
    margin: 6px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* WRAPPER ROWS */
  .chat-row-user { display: flex; align-items: flex-end; gap: 8px; max-width: 82%; align-self: flex-start; }
  .chat-row-admin { display: flex; justify-content: flex-end; width: 100%; align-self: flex-end; }

  .chat-avatar {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    background: #0f172a;
    color: #fbbf24;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
  }

  /* BUBBLE WARGA */
  .chat-bubble {
    background: #ffffff;
    padding: 10px 14px;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
    width: fit-content;
    max-width: 100%;
    word-break: break-word;
  }
  .chat-user { font-size: 11px; font-weight: 800; color: #2563eb; margin-bottom: 2px; }
  .chat-text { font-size: 13px; line-height: 1.45; word-break: break-word; color: #334155; }
  .chat-time { font-size: 9px; color: #94a3b8; font-weight: 600; margin-top: 4px; text-align: right; }

  /* BUBBLE ADMIN */
  .chat-bubble.admin-msg {
    background: #0f172a;
    color: #ffffff;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
    border: none;
    max-width: 82%;
    width: fit-content;
    padding: 10px 14px;
    word-break: break-word;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
  }
  .chat-bubble.admin-msg .chat-user { color: #fbbf24; margin-bottom: 4px; }
  .chat-bubble.admin-msg .chat-text { color: #f8fafc; }
  .chat-bubble.admin-msg .chat-time { color: #94a3b8; }

  .badge-admin {
    background: #ef4444;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* INPUT BOTTOM BAR */
  .input-bar {
    background: #ffffff;
    padding: 12px 16px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    bottom: 0;
    z-index: 20;
  }
  .input-control {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid #cbd5e1;
    border-radius: 16px;
    font-size: 13px;
    outline: none;
    background: #f8fafc;
    color: #0f172a;
    transition: all 0.2s ease;
  }
  .input-control:focus { border-color: #0f172a; background: #ffffff; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }
  .btn-send {
    background: #0f172a;
    color: #fbbf24;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s ease;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
  }
  .btn-send:active { transform: scale(0.92); }

  .empty-chat { text-align: center; padding: 40px 20px; color: #64748b; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="header-app">
    <div class="header-left">
      <a href="../index.html" class="btn-back" title="Kembali">←</a>
      <div class="header-title">
        <h1>💬 Diskusi Warga</h1>
        <p>RW 05 Poncol Jaya</p>
      </div>
    </div>

    <!-- TAMPILAN ADMIN: SWITCH MODE -->
    <div class="admin-switch-wrap" id="adminSwitchWrap">
      <span id="roleLabel">MODE: WARGA</span>
      <label class="switch-toggle">
        <input type="checkbox" id="chkAdminMode">
        <span class="slider"></span>
      </label>
    </div>

    <!-- TAMPILAN WARGA: BADGE LIMIT -->
    <div class="limit-badge-warga" id="wargaLimitBadge">
      ⚡ 30 Pesan Terbaru
    </div>
  </div>

  <!-- CHAT MESSAGES AREA -->
  <div class="chat-area" id="chatArea">
    <div class="empty-chat" id="emptyChat">Memuat obrolan diskusi warga...</div>
  </div>

  <!-- INPUT BAR -->
  <form class="input-bar" id="formDiskusi">
    <input type="text" id="inputPesan" class="input-control" placeholder="Tulis komentar warga..." required autocomplete="off">
    <button type="submit" class="btn-send" id="btnKirim">🚀</button>
  </form>
</div>

<script src="../assets/js/script.js?v=27"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// DATA WARGA AKTIF
const userSession = JSON.parse(localStorage.getItem('rw05_current_user') || 'null');
const currentUserName = userSession && userSession.nama ? userSession.nama : 'Warga';

// INISIAL AVATAR
function getTwoInitials(nama = '') {
  const parts = nama.trim().split(/\s+/);
  if (!parts[0]) return 'WG';
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
}

const currentUserAvatar = (userSession && userSession.avatarEmoji) ? userSession.avatarEmoji : getTwoInitials(currentUserName);

// ELEMEN HEADER
const adminSwitchWrap = document.getElementById('adminSwitchWrap');
const wargaLimitBadge = document.getElementById('wargaLimitBadge');
const chkAdminMode = document.getElementById('chkAdminMode');
const roleLabel = document.getElementById('roleLabel');

let isSendingAsAdmin = false;

// CHECK STATUS AUTH FOR ADMIN SWITCH
onAuthStateChanged(auth, (user) => {
  if (user && user.email) {
    if (adminSwitchWrap) adminSwitchWrap.style.display = 'flex';
    if (wargaLimitBadge) wargaLimitBadge.style.display = 'none';
  } else {
    if (adminSwitchWrap) adminSwitchWrap.style.display = 'none';
    if (wargaLimitBadge) wargaLimitBadge.style.display = 'flex';
    isSendingAsAdmin = false;
  }
});

if (chkAdminMode) {
  chkAdminMode.addEventListener('change', (e) => {
    isSendingAsAdmin = e.target.checked;
    if (roleLabel) {
      roleLabel.textContent = isSendingAsAdmin ? 'MODE: ADMIN' : 'MODE: WARGA';
      roleLabel.style.color = isSendingAsAdmin ? '#22c55e' : '#fbbf24';
    }
    const inputPesan = document.getElementById('inputPesan');
    if (inputPesan) {
      inputPesan.placeholder = isSendingAsAdmin ? "Tulis pesan sebagai Admin RW..." : "Tulis komentar warga...";
    }
  });
}

function showCustomAlert(message, redirectUrl) {
  let alertModal = document.getElementById('customAlertModal');
  if (!alertModal) {
    alertModal = document.createElement('div');
    alertModal.id = 'customAlertModal';
    alertModal.style.cssText = 'position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(6px); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;';
    alertModal.innerHTML = `
      <div style="background:#ffffff; width:100%; max-width:320px; border-radius:24px; padding:24px 20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.15);">
        <div style="font-size:36px; margin-bottom:12px;">🔒</div>
        <h3 style="font-size:15px; font-weight:800; color:#0f172a; margin-bottom:8px;">Autentikasi Diperlukan</h3>
        <p id="customAlertMsg" style="font-size:12px; color:#475569; font-weight:600; line-height:1.4; margin-bottom:20px;"></p>
        <button type="button" id="customAlertBtn" style="width:100%; padding:12px; background:#0f172a; color:#fbbf24; border:none; border-radius:14px; font-weight:800; font-size:13px; cursor:pointer;">Masuk / Daftar</button>
      </div>
    `;
    document.body.appendChild(alertModal);
  }
  document.getElementById('customAlertMsg').textContent = message;
  alertModal.style.display = 'flex';

  document.getElementById('customAlertBtn').onclick = () => {
    alertModal.style.display = 'none';
    if (redirectUrl) {
      window.location.href = redirectUrl;
    }
  };
}

function escapeHtml(str = '') {
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

// FORMAT TANGGAL
function formatDateLabel(dateObj) {
  if (!dateObj) return 'HARI INI';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  const targetDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());

  if (targetDate.getTime() === today.getTime()) {
    return 'HARI INI';
  } else if (targetDate.getTime() === yesterday.getTime()) {
    return 'KEMARIN';
  } else {
    return dateObj.toLocaleDateString('id-ID', {
      weekday: 'long',
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }
}

const chatArea = document.getElementById('chatArea');
const emptyChat = document.getElementById('emptyChat');

// REALTIME LISTENER CHAT (LIMIT 30)
const qDiskusi = query(collection(db, "diskusi_rw05"), orderBy("createdAt", "desc"), limit(30));

onSnapshot(qDiskusi, (snap) => {
  if (snap.empty) {
    if (emptyChat) emptyChat.textContent = "Belum ada diskusi. Mulai obrolan pertama!";
    return;
  }

  let messages = [];
  snap.forEach((docSnap) => {
    const d = docSnap.data();
    let timeStr = 'Baru saja';
    let rawDate = new Date();

    if (d.createdAt?.toDate) {
      rawDate = d.createdAt.toDate();
      timeStr = rawDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':') + ' WIB';
    }

    messages.push({
      id: docSnap.id,
      userName: d.userName || 'Warga',
      text: d.text || '',
      time: timeStr,
      rawDate: rawDate,
      dateKey: rawDate.toDateString(),
      isAdmin: d.isAdmin === true,
      userAvatar: d.userAvatar || getTwoInitials(d.userName || 'Warga')
    });
  });

  messages.reverse();

  let html = '';
  let lastDateKey = null;

  messages.forEach((m) => {
    if (m.dateKey !== lastDateKey) {
      const dateLabel = formatDateLabel(m.rawDate);
      html += `<div class="date-separator">${dateLabel}</div>`;
      lastDateKey = m.dateKey;
    }

    if (m.isAdmin) {
      html += `
        <div class="chat-row-admin">
          <div class="chat-bubble admin-msg">
            <div class="chat-user">
              <span class="badge-admin">ADMIN RW</span>
            </div>
            <div class="chat-text">${escapeHtml(m.text)}</div>
            <div class="chat-time">${m.time}</div>
          </div>
        </div>
      `;
    } else {
      html += `
        <div class="chat-row-user">
          <div class="chat-avatar">${m.userAvatar}</div>
          <div class="chat-bubble">
            <div class="chat-user">${escapeHtml(m.userName)}</div>
            <div class="chat-text">${escapeHtml(m.text)}</div>
            <div class="chat-time">${m.time}</div>
          </div>
        </div>
      `;
    }
  });

  if (chatArea) {
    chatArea.innerHTML = html;
    chatArea.scrollTop = chatArea.scrollHeight;
  }
});

// HANDLER KIRIM PESAN
const formDiskusi = document.getElementById('formDiskusi');
const inputPesan = document.getElementById('inputPesan');
const btnKirim = document.getElementById('btnKirim');

if (formDiskusi) {
  formDiskusi.addEventListener('submit', async (e) => {
    e.preventDefault();
    const textVal = inputPesan.value.trim();
    if (!textVal) return;

    btnKirim.disabled = true;
    inputPesan.disabled = true;

    try {
      const senderName = isSendingAsAdmin ? "ADMIN RW" : currentUserName;

      await addDoc(collection(db, "diskusi_rw05"), {
        userName: senderName,
        text: textVal,
        isAdmin: isSendingAsAdmin,
        userAvatar: isSendingAsAdmin ? "" : currentUserAvatar,
        createdAt: serverTimestamp()
      });

      inputPesan.value = '';
    } catch (err) {
      console.error('Firestore Error:', err);
      showCustomAlert('⚠️ Silakan login/daftar akun terlebih dahulu untuk mengirim pesan diskusi warga.', 'profil.html');
    } finally {
      btnKirim.disabled = false;
      inputPesan.disabled = false;
      inputPesan.focus();
    }
  });
}
</script>
</body>
</html>
