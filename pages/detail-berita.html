<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detail Berita - KATARNOLIMA RW 05</title>
    <link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* RESET & SYSTEM BASE */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
        }

        .mobile-container {
            max-width: 440px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
            box-shadow: 0 0 30px rgba(15, 23, 42, 0.05);
            position: relative;
        }

        /* STICKY HEADER */
        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            border-bottom: 1px solid #f1f5f9;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            cursor: pointer;
        }
        .back-btn:active { transform: scale(0.92); }

        .brand-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            background: #0f172a;
            color: #fbbf24;
            padding: 5px 12px;
            border-radius: 99px;
            text-transform: uppercase;
        }

        /* CONTENT BODY */
        .content-body { padding: 20px; }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            color: #2563eb;
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.35;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .meta-info {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .meta-item { display: flex; align-items: center; gap: 4px; }

        .article-image-wrap {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
        }

        .article-image {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }

        .article-content {
            font-size: 13.5px;
            color: #334155;
            line-height: 1.7;
            white-space: pre-line;
            word-break: break-word;
        }

        /* BUTTON BACK ACTION */
        .action-footer {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }
        .btn-return {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #0f172a;
            color: #fbbf24;
            font-size: 12px;
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
            transition: transform 0.15s ease;
            cursor: pointer;
        }
        .btn-return:active { transform: scale(0.96); }

        /* LOADING & ERROR STATES */
        .state-box {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }
        .state-icon { font-size: 36px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- HEADER STICKY -->
    <div class="header-nav">
        <a href="javascript:void(0)" onclick="goToBeritaRW()" class="back-btn" title="Kembali ke Berita RW">←</a>
        <div class="brand-badge">KATARNOLIMA RW 05</div>
    </div>

    <!-- MAIN ARTICLE BODY -->
    <div class="content-body" id="article-container">
        <div class="state-box">
            <span class="state-icon">🔄</span>
            Memuat artikel...
        </div>
    </div>
</div>

<script type="module">
// @ts-nocheck
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
  authDomain: "katarnolima-rw05.firebaseapp.com",
  projectId: "katarnolima-rw05",
  storageBucket: "katarnolima-rw05.firebasestorage.app",
  messagingSenderId: "965647612835",
  appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadArticleDetail() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('article-container');

    if (!id) {
        container.innerHTML = `
            <div class="state-box">
                <span class="state-icon">⚠️</span>
                <div style="font-weight:800; color:#0f172a; margin-bottom:6px;">ID Artikel Tidak Ditemukan</div>
                <p style="margin-bottom:16px;">Silakan pilih berita yang ingin Anda baca melalui halaman daftar berita.</p>
                <a href="javascript:void(0)" onclick="goToBeritaRW()" class="btn-return">Kembali ke Berita RW</a>
            </div>`;
        return;
    }

    try {
        const docRef = doc(db, "berita_rw05", id);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
            container.innerHTML = `
                <div class="state-box">
                    <span class="state-icon">📭</span>
                    <div style="font-weight:800; color:#0f172a; margin-bottom:6px;">Artikel Tidak Ditemukan</div>
                    <p style="margin-bottom:16px;">Berita ini mungkin telah dihapus oleh pengurus RW 05.</p>
                    <a href="javascript:void(0)" onclick="goToBeritaRW()" class="btn-return">Kembali ke Berita RW</a>
                </div>`;
            return;
        }

        const d = docSnap.data();
        document.title = `${d.judul || 'Detail Berita'} - KATARNOLIMA RW 05`;

        const imageHtml = d.fotoBase64 
            ? `<div class="article-image-wrap"><img src="${d.fotoBase64}" class="article-image" alt="Dokumentasi Berita"></div>` 
            : '';
        const ikonKat = d.ikon || '🌸';
        const katLabel = d.kategoriLabel || 'Informasi Warga';

        container.innerHTML = `
            <div class="kicker"><span>${ikonKat}</span> <span>${katLabel}</span></div>
            <h1 class="title">${escapeHtml(d.judul || 'Tanpa Judul')}</h1>
            <div class="meta-info">
                <span class="meta-item">📅 ${d.tanggal || '-'}</span>
                ${d.lokasi ? `<span class="meta-item">📍 ${escapeHtml(d.lokasi)}</span>` : ''}
                <span class="meta-item">✍️ ${escapeHtml(d.penulis || 'Pengurus RW 05')}</span>
            </div>
            ${imageHtml}
            <div class="article-content">${escapeHtml(d.isi || 'Tidak ada konten deskripsi.')}</div>
            
            <div class="action-footer">
                <a href="javascript:void(0)" onclick="goToBeritaRW()" class="btn-return">← Kembali ke Daftar Berita</a>
            </div>
        `;
    } catch (error) {
        console.error("Gagal memuat detail berita:", error);
        container.innerHTML = `
            <div class="state-box">
                <span class="state-icon">❌</span>
                <div style="font-weight:800; color:#0f172a; margin-bottom:6px;">Gagal Memuat Berita</div>
                <p style="margin-bottom:16px;">Periksa koneksi internet Anda lalu coba lagi.</p>
                <a href="javascript:void(0)" onclick="goToBeritaRW()" class="btn-return">Kembali ke Berita RW</a>
            </div>`;
    }
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}

document.addEventListener('DOMContentLoaded', loadArticleDetail);
</script>

<script>
// --- PENANGANAN NAVIGASI BACK HP/SISTEM AGAR KE BERITA-RW.HTML ---
function goToBeritaRW() {
    window.location.href = 'berita-rw.html';
}

// Menyiapkan history state saat halaman dibuka
window.history.pushState({ page: 'detail-berita' }, '', window.location.href);

// Menangkap gesture/tombol back HP
window.addEventListener('popstate', function(e) {
    goToBeritaRW();
});
</script>

</body>
</html>
