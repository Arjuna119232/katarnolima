<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KATARNOLIMA RW 05 - Berita & Informasi RW</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../assets/css/style.css?v=27">
<style>
  /* RESET & BASE SYSTEM */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
  }
  body {
    background: #f8fafc !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
    line-height: 1.5;
  }
  .app-jaki {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    padding-bottom: 30px;
  }
  
  /* HERO HEADER MODERN */
  .berita-header-blue {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #ffffff;
    padding: 20px 20px 28px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
    position: relative;
    overflow: hidden;
  }
  .berita-header-blue::after {
    content: "📰";
    position: absolute;
    right: -10px;
    bottom: -15px;
    font-size: 110px;
    opacity: 0.08;
    pointer-events: none;
  }
  .header-nav-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .btn-back-berita {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    transition: transform 0.15s ease;
  }
  .btn-back-berita:active { transform: scale(0.92); }
  .berita-header-blue h1 {
    font-size: 18px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.2px;
  }
  .berita-greeting {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 6px;
    color: #fbbf24;
  }
  .berita-desc {
    font-size: 12px;
    color: #e2e8f0;
    line-height: 1.5;
    font-weight: 500;
  }

  /* SECTION CONTAINER */
  .section-container { padding: 20px 20px 0; }
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 14px;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* KARTU BERITA / NEWS CARD ITEM */
  .news-card-item {
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .news-card-item:active { transform: scale(0.98); }
  
  .news-thumb-wrap {
    width: 100%;
    height: 170px;
    overflow: hidden;
    background: #f1f5f9;
    position: relative;
  }
  .news-card-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .news-card-content { padding: 16px; }
  
  .news-card-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 800;
    background: #eff6ff;
    color: #2563eb;
    padding: 4px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .news-card-title {
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.4;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }
  .news-card-desc {
    font-size: 12px;
    color: #475569;
    line-height: 1.5;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    border-top: 1px solid #f1f5f9;
    padding-top: 12px;
  }
  .btn-read-more {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
    text-decoration: none;
    background: #f0fdf4;
    color: #16a34a;
    padding: 6px 12px;
    border-radius: 10px;
    transition: background 0.15s ease;
  }
  .btn-read-more:active { background: #dcfce7; }

  /* KARTU URGENT / MENDESAK BANNER */
  .news-card-item.urgent {
    border: 1.5px solid #fca5a5;
    background: #fffdfd;
  }
  .news-card-item.urgent .news-card-badge {
    background: #fef2f2;
    color: #dc2626;
  }
  .news-card-item.urgent .btn-read-more {
    background: #fef2f2;
    color: #dc2626;
  }

  /* LOADING STATE & EMPTY STATE */
  .state-box {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
    font-weight: 600;
    border: 1.5px dashed #cbd5e1;
    margin-top: 6px;
  }
  .state-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
  }
</style>
</head>
<body>

<div class="app-jaki">
  <!-- HEADER BLUE -->
  <div class="berita-header-blue">
    <div class="header-nav-top">
      <!-- FIXED PATH KE ../index.html -->
      <a href="../index.html" class="btn-back-berita" id="btnBackHeader">←</a>
      <h1>Berita & Informasi</h1>
    </div>
    <div class="berita-greeting">Hai, Warga RW 05! 👋</div>
    <div class="berita-desc">Dapatkan berita kegiatan, pengumuman resmi, dan informasi terkini RW 05 Poncol Jaya yang terpercaya dan bebas hoaks.</div>
  </div>

  <!-- INFORMASI TERKINI -->
  <div class="section-container">
    <div class="section-title">
      <span>Informasi Terkini RW 05</span>
      <span style="font-size:11px; font-weight:700; color:#64748b; background:#f1f5f9; padding:3px 8px; border-radius:6px;">Realtime</span>
    </div>
    <div id="listBeritaRealtime">
      <div class="state-box">
        <span class="state-icon">🔄</span>
        Memuat informasi terbaru...
      </div>
    </div>
  </div>

  <div style="height:20px;"></div>
</div>

<script src="../assets/js/script.js?v=27"></script>
<script type="module">
  // @ts-nocheck
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
    authDomain: "katarnolima-rw05.firebaseapp.com",
    projectId: "katarnolima-rw05",
    storageBucket: "katarnolima-rw05.firebasestorage.app",
    messagingSenderId: "965647612835",
    appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // LOGIKA PENANGAAN BACK HARDWARE HP & TOMBOL HEADER
  const handleHardwareBackButtonPages = function(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();

    if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
      window.history.back();
    } else {
      window.location.href = '../index.html';
    }
  };

  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.removeAllListeners();
    window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBackButtonPages);
  } else {
    document.removeEventListener('backbutton', handleHardwareBackButtonPages);
    document.addEventListener('backbutton', handleHardwareBackButtonPages, false);
  }

  function renderBerita(list) {
    const container = document.getElementById('listBeritaRealtime');
    if (!container) return;

    if (!list || list.length === 0) {
      container.innerHTML = `
        <div class="state-box">
          <span class="state-icon">📭</span>
          Belum ada berita atau informasi publikasi saat ini.
        </div>
      `;
      return;
    }

    container.innerHTML = list.map(item => {
      const isUrgent = item.prioritas === 'urgent';
      const ikonKat = item.ikon || '🌸';
      const katLabel = item.kategoriLabel || 'Kegiatan Warga';
      const detailUrl = item.id ? `detail-berita.html?id=${item.id}` : 'detail-berita.html';
      const thumbHtml = item.fotoBase64 
        ? `<div class="news-thumb-wrap"><img src="${item.fotoBase64}" class="news-card-thumb" alt="Foto Berita" loading="lazy"></div>` 
        : '';

      return `
        <div class="news-card-item ${isUrgent ? 'urgent' : ''}">
          ${thumbHtml}
          <div class="news-card-content">
            <span class="news-card-badge">${ikonKat} ${katLabel} ${isUrgent ? '• MENDESAK' : ''}</span>
            <div class="news-card-title">${item.judul || 'Tanpa Judul'}</div>
            <div class="news-card-desc">${item.isi || ''}</div>
            <div class="news-card-meta">
              <span>✍️ ${item.penulis || 'Pengurus RW 05'}</span>
              <span>📅 ${item.tanggal || '-'}</span>
            </div>
            <div style="margin-top: 14px; text-align: right;">
              <a href="${detailUrl}" class="btn-read-more">Baca Selengkapnya →</a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    const btnBackHeader = document.getElementById('btnBackHeader');
    if (btnBackHeader) {
      btnBackHeader.addEventListener('click', (e) => {
        e.preventDefault();
        handleHardwareBackButtonPages(e);
      });
    }

    // KUOTA OPTIMIZATION: DIBATASI HANYA MEMUAT 10 BERITA TERBARU
    const qBerita = query(collection(db, "berita_rw05"), orderBy("createdAt", "desc"), limit(10));

    onSnapshot(qBerita, 
      (snap) => {
        let allBeritaData = [];
        snap.forEach(docSnap => {
          allBeritaData.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        renderBerita(allBeritaData);
      },
      (error) => {
        console.error("Error Firestore:", error);
        renderBerita([]);
      }
    );
  });
</script>
</body>
</html>
