<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KATARNOLIMA RW 05 - Berita RW</title>
<link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=27">
<style>
  body { background: #f6f8ff !important; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .app-jaki { max-width: 440px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 30px; }
  
  /* HERO HEADER ALA JAKI BERITA */
  .berita-header-blue {
    background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
    color: #ffffff;
    padding: 16px 20px 24px;
    border-radius: 0 0 28px 28px;
  }
  .header-nav-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .btn-back-berita { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; text-decoration: none; display: flex; align-items: center; }
  .berita-header-blue h1 { font-size: 18px; font-weight: 800; margin: 0; }
  .berita-greeting { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .berita-desc { font-size: 12px; opacity: 0.9; line-height: 1.4; }

  /* SECTION */
  .section-container { padding: 20px 16px 0; }
  .section-title { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 12px; }

  /* INFORMASI TERKINI CARD / LIST */
  .news-card-item {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1.5px solid #e2e8f0;
    box-shadow: 0 4px 14px rgba(15,23,42,0.04);
  }
  .news-card-thumb { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #e2e8f0; }
  .news-card-content { padding: 16px; }
  .news-card-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; background: #eff6ff; color: #2563eb; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }
  .news-card-title { font-size: 14px; font-weight: 800; color: #0f172a; line-height: 1.4; margin-bottom: 8px; }
  .news-card-desc { font-size: 12px; color: #475569; line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .news-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 10px; }

  /* URGENT BANNER MERAH */
  .news-card-item.urgent { border: 1.5px solid #f87171; background: #fff5f5; }
  .news-card-item.urgent .news-card-badge { background: #fee2e2; color: #dc2626; }
</style>
</head>
<body>

<div class="app-jaki">
  <!-- HEADER BLUE -->
  <div class="berita-header-blue">
    <div class="header-nav-top">
      <a href="../index.html" class="btn-back-berita">←</a>
      <h1>Berita</h1>
    </div>
    <div class="berita-greeting">Hai, Warga RW 05!</div>
    <div class="berita-desc">Temukan informasi kegiatan, pengumuman resmi RW 05 Poncol Jaya yang bebas hoaks di sini.</div>
  </div>

  <!-- INFORMASI TERKINI -->
  <div class="section-container" style="padding-top: 14px;">
    <div class="section-title">Informasi Terkini RW 05</div>
    <div id="listBeritaRealtime">
      <div style="background:#fff; border-radius:16px; padding:24px; text-align:center; color:#94a3b8; font-size:12px; border:1px dashed #cbd5e1;">
        Memuat informasi...
      </div>
    </div>
  </div>

  <div style="height:20px;"></div>
</div>

<script src="script.js?v=27"></script>
<script type="module">
  // @ts-nocheck
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
    authDomain: "katarnolima-rw05.firebaseapp.com",
    projectId: "katarnolima-rw05",
    storageBucket: "katarnolima-rw05.firebasestorage.app",
    messagingSenderId: "965647612835",
    appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function renderBerita(list) {
    const container = document.getElementById('listBeritaRealtime');
    if (!container) return;

    if (!list || list.length === 0) {
      container.innerHTML = `
        <div style="background:#fff; border-radius:16px; padding:24px; text-align:center; color:#94a3b8; font-size:12px; border:1px dashed #cbd5e1;">
          Belum ada informasi
        </div>
      `;
      return;
    }

    container.innerHTML = list.map(item => {
      const isUrgent = item.prioritas === 'urgent';
      const ikonKat = item.ikon || '🌸';
      const katLabel = item.kategoriLabel || 'Kegiatan Warga';
      const detailUrl = item.id ? `detail-berita.html?id=${item.id}` : 'detail-berita.html';
      const thumbHtml = item.fotoBase64 ? `<img src="${item.fotoBase64}" class="news-card-thumb" alt="Foto Berita">` : '';

      return `
        <div class="news-card-item ${isUrgent ? 'urgent' : ''}">
          ${thumbHtml}
          <div class="news-card-content">
            <span class="news-card-badge">${ikonKat} ${katLabel} ${isUrgent ? '• MENDESAK' : ''}</span>
            <div class="news-card-title">${item.judul || 'Tanpa Judul'}</div>
            <div class="news-card-desc">${item.isi || ''}</div>
            <div class="news-card-meta">
              <span>✍️ ${item.penulis || 'Pengurus RW 05'}</span>
              <span>📅 ${item.tanggal || '-'}</span>
            </div>
            <div style="margin-top: 12px; text-align: right;">
              <a href="${detailUrl}" style="font-size: 11px; font-weight: 800; color: #2563eb; text-decoration: none;">Baca Selengkapnya →</a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    onSnapshot(query(collection(db, "berita_rw05"), orderBy("createdAt", "desc")), 
      (snap) => {
        let allBeritaData = [];
        snap.forEach(docSnap => {
          allBeritaData.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        renderBerita(allBeritaData);
      },
      (error) => {
        console.error("Error Firestore:", error);
        renderBerita([]);
      }
    );
  });
</script>
</body>
</html>
