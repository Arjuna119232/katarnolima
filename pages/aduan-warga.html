<!DOCTYPE html>
<!-- @ts-nocheck -->
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KATARNOLIMA RW 05 - Lapor Aduan Warga</title>
<link rel="icon" href="../assets/img/logo-resmi-karang-taruna.jpg">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../assets/css/style.css?v=27">
<style>
  /* RESET & BASE SYSTEM */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
  }
  body {
    background: #f8fafc !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
    line-height: 1.5;
  }

  /* HEADER TOPBAR */
  .header-app {
    background: #ffffff;
    color: #0f172a;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #e2e8f0;
  }
  .header-left-grp { display: flex; align-items: center; gap: 12px; }
  
  .btn-back-direct {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #0f172a;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    text-decoration: none;
  }
  
  .btn-search-icon {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    font-size: 16px;
    cursor: pointer;
    color: #0f172a;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* HERO BANNER AJAKAN LAPOR */
  .hero-lapor-card {
    background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
    border-radius: 24px;
    padding: 24px 20px;
    margin: 20px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
    border: 1px solid #e2e8f0;
    text-align: center;
  }
  .hero-lapor-card .illustration {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    background: #eff6ff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .hero-lapor-card h2 {
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .btn-jaki-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    border: none;
    margin-bottom: 10px;
  }
  .btn-foto-jaki { background: #0f172a; color: #fbbf24; }
  .btn-video-jaki { background: #ffffff; color: #0f172a; border: 1.5px solid #cbd5e1; }

  /* SECTION TITLE */
  .section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    margin-top: 24px;
    margin-bottom: 14px;
  }
  .section-header-row h3 { font-size: 15px; font-weight: 800; color: #0f172a; margin: 0; }
  .section-header-row a { font-size: 12px; font-weight: 800; color: #2563eb; text-decoration: none; }

  /* KARTU LAPORAN */
  .active-report-card {
    background: #ffffff;
    border-radius: 20px;
    margin: 0 20px 12px;
    padding: 14px;
    border: 1px solid #e2e8f0;
    display: flex;
    gap: 14px;
    cursor: pointer;
  }
  .active-report-thumb { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
  .active-report-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .badge-kat { font-size: 10px; color: #475569; font-weight: 800; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; width: fit-content; }
  .report-title-text { font-size: 13px; font-weight: 800; color: #0f172a; line-height: 1.35; }
  .report-meta-text { font-size: 11px; color: #64748b; font-weight: 600; }
  
  .badge-status-dinamis { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 8px; width: fit-content; }
  .badge-status-dinamis.MenungguVerifikasi, .badge-status-dinamis.Menunggu { background: #fef3c7; color: #b45309; }
  .badge-status-dinamis.Diproses { background: #e0f2fe; color: #0369a1; }
  .badge-status-dinamis.Selesai { background: #dcfce7; color: #15803d; }

  /* MODAL PANEL */
  .form-panel-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
  }
  .form-panel-modal.show { display: flex; }
  .form-panel-content {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 28px 28px 0 0;
    padding: 24px 20px;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-weight: 800; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
  .form-control {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1.5px solid #cbd5e1;
    font-size: 13px;
    outline: none;
    background: #f8fafc;
    color: #0f172a;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    color: #fbbf24;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  .badge-gps { display: inline-block; padding: 6px 12px; background: #e0f2fe; color: #0369a1; border-radius: 12px; font-size: 11px; font-weight: 800; }

  /* POP-UP DIALOG MODERN */
  .modern-dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(8px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
  }
  .modern-dialog-overlay.show { opacity: 1; pointer-events: auto; }
  .modern-dialog-card {
    background: #ffffff;
    width: 100%;
    max-width: 330px;
    border-radius: 28px;
    padding: 24px 20px;
    text-align: center;
  }
  .modern-dialog-icon { width: 64px; height: 64px; border-radius: 22px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .modern-dialog-icon.warning { background: #fef3c7; color: #d97706; }
  .modern-dialog-icon.success { background: #dcfce7; color: #16a34a; }
  .modern-dialog-icon.error { background: #fee2e2; color: #dc2626; }
  .modern-dialog-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
  .modern-dialog-msg { font-size: 12.5px; color: #475569; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
  .btn-dialog-primary { width: 100%; padding: 13px; background: #0f172a; color: #fbbf24; border: none; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-jaki" style="max-width:440px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:30px;">
  <!-- HEADER -->
  <div class="header-app">
    <div class="header-left-grp">
      <a href="../index.html" class="btn-back-direct">←</a>
      <h1 style="font-size:16px; font-weight:800; margin:0;">Laporan Warga</h1>
    </div>
    <button class="btn-search-icon" id="btnToggleSearch">🔍</button>
  </div>

  <!-- HERO CARD -->
  <div class="hero-lapor-card">
    <div class="illustration">📢</div>
    <h2>Ada Masalah di Lingkungan RW 05?<br>Buat Laporan Aduan, Yuk!</h2>
    <button type="button" id="btnTriggerFoto" class="btn-jaki-action btn-foto-jaki">
      <span>📷</span> Buat Laporan Foto
    </button>
    <button type="button" id="btnTriggerVideo" class="btn-jaki-action btn-video-jaki">
      <span>📹</span> Buat Laporan Video
    </button>
  </div>

  <!-- SECTION LAPORAN SAYA -->
  <div class="section-header-row">
    <h3>Laporan Aktif Milikmu</h3>
    <a href="aktivitas.html">Lihat Semua</a>
  </div>
  <div id="dynamicMyReports" style="display:flex; flex-direction:column;"></div>

  <!-- SECTION SEMUA LAPORAN -->
  <div class="section-header-row" style="margin-top:28px;">
    <h3>Semua Laporan Warga RW 05</h3>
  </div>
  <div id="dynamicAllReports" style="display:flex; flex-direction:column;"></div>
</div>

<!-- MODAL FORM INPUT LAPORAN -->
<div class="form-panel-modal" id="modalFormAduan">
  <div class="form-panel-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <h3 style="margin:0; font-size:16px; font-weight:800; color:#0f172a;">Form Laporan Warga</h3>
      <button type="button" id="btnCloseModal" style="background:#f1f5f9; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; font-weight:800; cursor:pointer;">✕</button>
    </div>
    <form id="formAduan">
      <div class="form-group">
        <label for="aduanNama">Nama Pelapor (Sesuai KTP/KK)</label>
        <input type="text" id="aduanNama" class="form-control" placeholder="Masukkan nama kamu..." required>
      </div>

      <div class="form-group">
        <label for="aduanRT">RT Tempat Kejadian</label>
        <select id="aduanRT" class="form-control" required>
          <option value="">-- Pilih RT --</option>
          <option value="RT 01">RT 01</option>
          <option value="RT 02">RT 02</option>
          <option value="RT 03">RT 03</option>
          <option value="RT 04">RT 04</option>
          <option value="RT 05">RT 05</option>
          <option value="RT 06">RT 06</option>
        </select>
      </div>

      <div class="form-group">
        <label for="aduanJudul">Judul Laporan / Kejadian</label>
        <input type="text" id="aduanJudul" class="form-control" placeholder="Contoh: Lampu jalan mati / Saluran tersumbat" required>
      </div>

      <div class="form-group">
        <label for="aduanDesc">Detail Keterangan</label>
        <textarea id="aduanDesc" class="form-control" rows="3" placeholder="Jelaskan kronologi atau lokasi detailnya..." required></textarea>
      </div>

      <div class="form-group" style="display:flex; gap:8px;">
        <button type="button" id="btnAmbilFotoOnly" class="btn-trigger" style="flex:1; padding:12px 8px; border-radius:12px; font-weight:800; font-size:11px; cursor:pointer; background:#eff6ff; color:#1d4ed8; border:1.5px dashed #bfdbfe;">
          <span>📷</span> Pilih Foto
        </button>
        <button type="button" id="btnGPS" class="btn-trigger" style="flex:1; padding:12px 8px; border-radius:12px; font-weight:800; font-size:11px; cursor:pointer; background:#f0fdf4; color:#15803d; border:1.5px dashed #bbf7d0;">
          <span>📍</span> Lock GPS
        </button>
      </div>

      <!-- INPUT FILE NATIVE KAMERA & GALERI -->
      <input type="file" id="inputFoto" accept="image/*" style="display:none;">

      <div id="previewContainer" style="display:none; text-align:center; margin-bottom:14px;">
        <img id="imgPreview" src="" alt="Preview Foto" style="max-width:100%; max-height:180px; border-radius:16px; border:1px solid #cbd5e1; object-fit:cover;">
        <div style="font-size:11px; color:#10b981; margin-top:6px; font-weight:800;">✅ Foto siap dikirim</div>
      </div>

      <div id="gpsInfo" style="display:none; text-align:center; margin-bottom:16px;">
        <span class="badge-gps">📍 Lokasi: <span id="coordsText">-</span></span>
      </div>

      <button type="submit" id="btnKirimAduan" class="btn-submit">Kirim Laporan Warga</button>
    </form>
  </div>
</div>

<!-- POP-UP DIALOG MODERN -->
<div class="modern-dialog-overlay" id="modernDialog">
  <div class="modern-dialog-card">
    <div class="modern-dialog-icon warning" id="dialogIcon">⚠️</div>
    <div class="modern-dialog-title" id="dialogTitle">Notifikasi</div>
    <div class="modern-dialog-msg" id="dialogMsg">Pesan notifikasi...</div>
    <button type="button" class="btn-dialog-primary" id="btnDialogClose">Mengerti</button>
  </div>
</div>

<script src="../assets/js/script.js?v=27"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
    authDomain: "katarnolima-rw05.firebaseapp.com",
    projectId: "katarnolima-rw05",
    storageBucket: "katarnolima-rw05.firebasestorage.app",
    messagingSenderId: "965647612835",
    appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let compressedBase64 = null;
  let latValue = null;
  let lngValue = null;

  window.showModernPopup = function({ title = 'Notifikasi', msg = '', type = 'warning' }) {
    const dialog = document.getElementById('modernDialog');
    const elTitle = document.getElementById('dialogTitle');
    const elMsg = document.getElementById('dialogMsg');
    const elIcon = document.getElementById('dialogIcon');
    const btnClose = document.getElementById('btnDialogClose');

    if (!dialog) return;
    if (elTitle) elTitle.textContent = title;
    if (elMsg) elMsg.textContent = msg;

    if (elIcon) {
      elIcon.className = `modern-dialog-icon ${type}`;
      elIcon.textContent = type === 'warning' ? '⚠️' : (type === 'success' ? '✅' : '❌');
    }

    dialog.classList.add('show');
    if (btnClose) btnClose.onclick = () => dialog.classList.remove('show');
  };

  document.addEventListener('DOMContentLoaded', () => {
    const modalForm = document.getElementById('modalFormAduan');
    const btnTriggerFoto = document.getElementById('btnTriggerFoto');
    const btnTriggerVideo = document.getElementById('btnTriggerVideo');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnAmbilFotoOnly = document.getElementById('btnAmbilFotoOnly');
    const inputFoto = document.getElementById('inputFoto');
    const imgPreview = document.getElementById('imgPreview');
    const previewContainer = document.getElementById('previewContainer');
    const btnGPS = document.getElementById('btnGPS');
    const coordsText = document.getElementById('coordsText');
    const gpsInfo = document.getElementById('gpsInfo');

    // EXPLICIT CALLING METHOD DARI VERSI 2.0 UNTUK TRIGGER PERMISSIONS NATIVE
    function openModalAndPickPhoto() {
      if (modalForm) modalForm.classList.add('show');
      if (inputFoto) inputFoto.click();
    }

    if (btnTriggerFoto) btnTriggerFoto.onclick = openModalAndPickPhoto;
    if (btnTriggerVideo) btnTriggerVideo.onclick = openModalAndPickPhoto;
    if (btnAmbilFotoOnly && inputFoto) btnAmbilFotoOnly.onclick = () => inputFoto.click();

    if (btnCloseModal) {
      btnCloseModal.onclick = () => modalForm.classList.remove('show');
    }

    if (inputFoto) {
      inputFoto.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (evt) => {
          compressedBase64 = evt.target.result;
          if (imgPreview) imgPreview.src = compressedBase64;
          if (previewContainer) previewContainer.style.display = 'block';
        };
      };
    }

    // MEMANGGIL WIN.REQUESTGEOLOCATION SEPERTI DI VERSI 2.0 UNTUK TRIGER PERMISSION NATIVE
    if (btnGPS) {
      btnGPS.onclick = () => {
        const win = window;
        if (typeof win.requestGeoLocation === 'function') {
          btnGPS.textContent = '📍 Merekam...';
          win.requestGeoLocation(
            (pos) => {
              latValue = pos.lat;
              lngValue = pos.lng;
              if (coordsText) coordsText.textContent = `${latValue.toFixed(5)}, ${lngValue.toFixed(5)}`;
              if (gpsInfo) gpsInfo.style.display = 'block';
              btnGPS.textContent = '✅ GPS Terkunci';
            },
            (err) => {
              btnGPS.textContent = '📍 Lock GPS';
              window.showModernPopup({
                title: 'Gagal Merekam GPS',
                msg: 'Pastikan fitur lokasi/GPS di HP kamu sudah aktif dan diizinkan.',
                type: 'error'
              });
            }
          );
        } else if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              latValue = pos.coords.latitude;
              lngValue = pos.coords.longitude;
              if (coordsText) coordsText.textContent = `${latValue.toFixed(5)}, ${lngValue.toFixed(5)}`;
              if (gpsInfo) gpsInfo.style.display = 'block';
              btnGPS.textContent = '✅ GPS Terkunci';
            },
            () => {
              window.showModernPopup({ title: 'GPS Gagal', msg: 'Gagal merekam lokasi GPS.', type: 'error' });
            }
          );
        }
      };
    }
  });
</script>
</body>
</html>
