// ---- Ditambahkan otomatis oleh CI (scripts/patch_android.py signing) ----

// R8 dimatikan/dinyalakan dari luar lewat -PMINIFY=<true|false> di workflow.
// Keduanya harus ikut berubah: shrinkResources HANYA boleh aktif kalau
// minifyEnabled aktif, kalau tidak Gradle gagal dengan
// "Removing unused resources requires unused code shrinking to be turned on".
ext.katarnolimaMinify = project.hasProperty('MINIFY')
        ? project.property('MINIFY').toString().toBoolean()
        : true

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

android {
    defaultConfig {
        minSdkVersion 24
    }

    // Aset sisa dari AAR dependensi (junit, LICENSE-junit, *.proto, artefak debug)
    // tidak dipakai aplikasi, tapi tetap ikut terbungkus di dalam APK. Menghapus
    // file di folder src/main/assets tidak cukup karena asalnya ada di dalam AAR —
    // harus lewat aturan packaging di sini.
    packaging {
        resources {
            excludes += [
                'LICENSE-junit.txt',
                'junit/**',
                'DebugProbesKt.bin',
                '**/*.proto'
            ]
        }
    }

    signingConfigs {
        release {
            storeFile file('release.p12')
            storeType 'PKCS12'
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release

            // R8: memangkas & mengaburkan kode rilis.
            // - minifyEnabled = membuang kelas/metode yang tak terpakai, lalu mengganti
            //   namanya sehingga kode sulit dibaca bila didekompilasi.
            // - shrinkResources = membuang resource yang jadi tak terpakai.
            //
            // Diatur per-rilis lewat MINIFY di workflow, karena kerusakannya baru
            // terlihat setelah APK terpasang di perangkat — bukan di log CI.
            minifyEnabled katarnolimaMinify
            shrinkResources katarnolimaMinify
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}