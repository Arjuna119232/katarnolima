// ---- Ditambahkan otomatis oleh CI (scripts/patch_android.py signing) ----
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

android {
    defaultConfig {
        minSdkVersion 24
    }
    signingConfigs {
        release {
            storeFile file('release.p12')
            storeType 'PKCS12'
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release

            // R8: memangkas & mengaburkan kode rilis.
            // - stripping  = membuang kelas yang tidak pernah dipakai (APK lebih kecil,
            //                detail internal tidak bocor ke pengguna).
            // - obfuscation= nama kelas/metode diganti, sulit dibaca bila didekompilasi.
            // Nonaktifkan (MINIFY=false di workflow) hanya bila ada plugin yang rusak.
            minifyEnabled project.hasProperty('MINIFY') ? project.property('MINIFY').toString().toBoolean() : true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}