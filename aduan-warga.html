<script>
// @ts-nocheck
document.addEventListener('DOMContentLoaded', function(){
  /** @type {HTMLElement | null} */ const fabContainer = document.getElementById('fabContainer');
  /** @type {HTMLElement | null} */ const fabMain = document.getElementById('fabMain');
  /** @type {HTMLElement | null} */ const fabClose = document.getElementById('fabClose');
  if(fabMain){ fabMain.addEventListener('click', function(e){ e.stopPropagation(); if(fabContainer) fabContainer.classList.add('active'); }); }
  if(fabClose){ fabClose.addEventListener('click', function(e){ e.stopPropagation(); if(fabContainer) fabContainer.classList.remove('active'); }); }

  const btn = document.getElementById('btnKirim');
  if(btn){
    btn.addEventListener('click', function(){
      /** @type {HTMLInputElement} */ const nama = document.getElementById('nama');
      /** @type {HTMLInputElement} */ const rt = document.getElementById('rt');
      /** @type {HTMLSelectElement} */ const kategori = document.getElementById('kategori');
      /** @type {HTMLTextAreaElement} */ const pesan = document.getElementById('pesan');
      
      // VALIDASI: Cek apakah kolom wajib sudah diisi
      const valNama = nama ? nama.value.trim() : '';
      const valRt = rt ? rt.value.trim() : '';
      const valKategori = kategori ? kategori.value : '';
      const valPesan = pesan ? pesan.value.trim() : '';

      if (!valNama) {
        alert('Harap isi Nama Lengkap kamu terlebih dahulu!');
        if(nama) nama.focus();
        return;
      }

      if (!valRt) {
        alert('Harap isi nomor RT tempat tinggalmu (contoh: RT 03)!');
        if(rt) rt.focus();
        return;
      }

      if (!valKategori) {
        alert('Pilih salah satu Kategori Aduan!');
        if(kategori) kategori.focus();
        return;
      }

      if (!valPesan) {
        alert('Harap tuliskan detail pesan aduanmu dengan jelas!');
        if(pesan) pesan.focus();
        return;
      }

      // Jika semua sudah diisi, rakit pesan WhatsApp
      const text = 'Halo RW 05, mau lapor aduan:%0A%0A' +
        'Nama: ' + encodeURIComponent(valNama) + '%0A' +
        'RT: ' + encodeURIComponent(valRt) + '%0A' +
        'Kategori: ' + encodeURIComponent(valKategori) + '%0A' +
        'Pesan: ' + encodeURIComponent(valPesan) + '%0A%0A' +
        'Dari Aplikasi KATARNOLIMA RW 05';

      window.open('https://wa.me/6289673580756?text=' + text, '_blank');
    });
  }

  // FIX KLIK CARI PINDAH HALAMAN
  /** @type {HTMLElement | null} */ const goCari = document.getElementById('goCari');
  if(goCari){
    goCari.addEventListener('click', function(e){
      e.preventDefault();
      window.location.href = 'cari-warga.html';
    });
  }
});
</script>
