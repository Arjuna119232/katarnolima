<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test Viewport</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; font-size: 14px; }
  h1 { font-size: 18px; }
  .box { background: #2563eb; padding: 20px; border-radius: 12px; margin: 10px 0; }
  .info { font-size: 12px; color: #fbbf24; margin-top: 20px; }
  .info p { margin: 5px 0; }
</style>
</head>
<body>
<h1>Test Viewport</h1>
<div class="box">Kotak 1 — padding 20px</div>
<div class="box">Kotak 2 — kalau melebar keluar layar, viewport bermasalah</div>
<div class="info">
  <p><b>Viewport Width:</b> <span id="vw"></span>px</p>
  <p><b>Device Width:</b> <span id="dw"></span>px</p>
  <p><b>Device Pixel Ratio:</b> <span id="dpr"></span></p>
  <p><b>Screen Width:</b> <span id="sw"></span>px</p>
</div>
<script>
  document.getElementById('vw').textContent = window.innerWidth;
  document.getElementById('dw').textContent = document.documentElement.clientWidth;
  document.getElementById('dpr').textContent = window.devicePixelRatio;
  document.getElementById('sw').textContent = screen.width;
</script>
</body>
</html>
