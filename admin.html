<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KATARNOLIMA - Dashboard Admin RW 05</title>
<link rel="icon" href="img/logo-resmi-karang-taruna.jpg">
<link rel="stylesheet" href="style.css?v=27">
<style>
  body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 50px; }
  .admin-header { background: #0f172a; color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
  .admin-container { padding: 16px; max-width: 600px; margin: 0 auto; }
  .card-box { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .card-aduan img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin: 10px 0; border: 1px solid #cbd5e1; }
  .badge-status { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .status-menunggu { background: #fef3c7; color: #b45309; }
  .status-proses { background: #eff6ff; color: #1d4ed8; }
  .status-selesai { background: #dcfce7; color: #15803d; }
  .btn-action { padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; flex: 1; }
  .btn-proses { background: #2563eb; color: #fff; }
  .btn-selesai { background: #16a34a; color: #fff; }
  .btn-hapus { background: #ef4444; color: #fff; }
  .form-control { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; margin-top: 4px; box-sizing: border-box; font-family: inherit; }
  .btn-save { width:100%; padding:12px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:800; font-size:13px; cursor:pointer; margin-top:10px; }
  .section-title { font-size:14px; font-weight:800; color:#0f172a; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>

<div class="admin-header">
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="back" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">←</button>
    <h1 style="font-size:16px; margin:0; font-weight:800;">Admin Master Panel RW 05</h1>
  </div>
  <span style="font-size:11px; background:#1e293b; padding:4px 8px; border-radius:6px; color:#fbbf24; font-weight:700;">Live Edit</span>
</div>

<div class="admin-container">

  <!-- 1. KONTROL TEKS & INFO DINAMIS APLIKASI -->
  <div class="card-box">
    <div class="section-title">⚙️ Teks & Pengumuman Utama (Live Update)</div>
    <form id="formConfig">
      <div style="margin-bottom:10px;">
        <label style="font-size:11px; font-weight:700; color:#475569;">Pesan Runing Text / Running Banner Beranda</label>
        <input type="text" id="cfgBannerText" class="form-control" placeholder="Contoh: Selamat Datang di Portal RW 05...">
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:11px; font-weight:700; color:#475569;">Saldo Kas RW 05 Terkini (Rp)</label>
        <input type="text" id="cfgSaldoKas" class="form-control" placeholder="Contoh: Rp 15.450.000">
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:11px; font-weight:700; color:#475569;">Informasi Sembako Murah</label>
        <textarea id="cfgSembakoText" class="form-control" rows="2" placeholder="Detail beras, minyak, dll..."></textarea>
      </div>
      <button type="submit" class="btn-save">Simpan Perubahan Teks Aplikasi</button>
    </form>
  </div>

  <!-- 2. PUBLIKASI BERITA BARU -->
  <div class="card-box">
    <div class="section-title">➕ Tambah / Publis Berita Baru</div>
    <form id="formBerita" style="display:flex; flex-direction:column; gap:10px;">
      <div>
        <label style="font-size:11px; font-weight:700; color:#475569;">Kategori Berita</label>
        <select id="beritaKat" class="form-control" required>
          <option value="kegiatan|🌸|Kegiatan">🌸 Kegiatan Warga</option>
          <option value="pengumuman|📢|Pengumuman">📢 Pengumuman Resmi</option>
          <option value="iuran|💰|Iuran">💰 Info Kas / Iuran</option>
        </select>
      </div>
      <div>
        <label style="font-size:11px; font-weight:700; color:#475569;">Judul Berita</label>
        <input type="text" id="beritaJudul" class="form-control" placeholder="Masukkan judul..." required>
      </div>
      <div>
        <label style="font-size:11px; font-weight:700; color:#475569;">Isi Berita / Keterangan</label>
        <textarea id="beritaIsi" class="form-control" rows="3" placeholder="Tulis rincian berita..." required></textarea>
      </div>
      <button type="submit" style="padding:12px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:800; font-size:13px; cursor:pointer;">Publikasikan Berita</button>
    </form>
  </div>

  <!-- 3. KELOLA BERITA TERPOSTING -->
  <div class="card-box">
    <div class="section-title">📰 Berita Terpublikasi</div>
    <div id="listBeritaAdmin" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- 4. KELOLA ADUAN WARGA -->
  <div class="section-title" style="margin-top:20px;">📥 Laporan Aduan Warga Masuk</div>
  <div id="loadingAdmin" style="text-align:center; padding:20px; color:#64748b; font-size:13px;">Memuat data aduan...</div>
  <div id="listAduanAdmin"></div>

</div>

<script src="script.js?v=27"></script>
<script type="module">
  // @ts-nocheck
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, doc, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZtvImbyZmqoEoY1hYZcuCbUpIl3R1fhE",
    authDomain: "katarnolima-rw05.firebaseapp.com",
    projectId: "katarnolima-rw05",
    storageBucket: "katarnolima-rw05.firebasestorage.app",
    messagingSenderId: "965647612835",
    appId: "1:965647612835:web:b712367f0d8beb7c5bf816"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const formConfig = document.getElementById('formConfig');
  const cfgBannerText = document.getElementById('cfgBannerText');
  const cfgSaldoKas = document.getElementById('cfgSaldoKas');
  const cfgSembakoText = document.getElementById('cfgSembakoText');

  const formBerita = document.getElementById('formBerita');
  const listBeritaAdmin = document.getElementById('listBeritaAdmin');
  const listAduanAdmin = document.getElementById('listAduanAdmin');
  const loadingAdmin = document.getElementById('loadingAdmin');

  // A. LOAD & SIMPAN TEKS APLIKASI (KONFIGURASI)
  onSnapshot(doc(db, "app_config", "main_settings"), (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      if (cfgBannerText) cfgBannerText.value = data.bannerText || '';
      if (cfgSaldoKas) cfgSaldoKas.value = data.saldoKas || '';
      if (cfgSembakoText) cfgSembakoText.value = data.sembakoText || '';
    }
  });

  if (formConfig) {
    formConfig.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await setDoc(doc(db, "app_config", "main_settings"), {
          bannerText: cfgBannerText.value,
          saldoKas: cfgSaldoKas.value,
          sembakoText: cfgSembakoText.value,
          updatedAt: serverTimestamp()
        }, { merge: true });
        alert('✅ Teks aplikasi berhasil di-update secara live!');
      } catch (err) {
        alert('❌ Gagal memperbarui konfigurasi teks.');
      }
    });
  }

  // B. KELOLA PUBLIKASI BERITA
  if (formBerita) {
    formBerita.addEventListener('submit', async (e) => {
      e.preventDefault();
      const katRaw = document.getElementById('beritaKat').value.split('|');
      try {
        await addDoc(collection(db, "berita_rw05"), {
          kategori: katRaw[0],
          ikon: katRaw[1],
          kategoriLabel: katRaw[2],
          judul: document.getElementById('beritaJudul').value,
          isi: document.getElementById('beritaIsi').value,
          tanggal: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }),
          penulis: "Pengurus RW 05",
          createdAt: serverTimestamp()
        });
        alert('✅ Berita dipublikasikan!');
        formBerita.reset();
      } catch (err) {
        alert('Gagal mempublikasikan berita.');
      }
    });
  }

  // LISTENER REALTIME BERITA
  onSnapshot(query(collection(db, "berita_rw05"), orderBy("createdAt", "desc")), (snapshot) => {
    let html = '';
    snapshot.forEach((docItem) => {
      const data = docItem.data();
      html += `
        <div style="padding:10px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:12px; font-weight:800;">${data.ikon} ${data.judul}</div>
            <div style="font-size:10px; color:#64748b;">${data.tanggal}</div>
          </div>
          <button onclick="hapusBerita('${docItem.id}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">Hapus</button>
        </div>
      `;
    });
    listBeritaAdmin.innerHTML = html || '<div style="font-size:11px; color:#94a3b8;">Belum ada berita.</div>';
  });

  window.hapusBerita = async function(id) {
    if (confirm('Hapus berita ini?')) {
      await deleteDoc(doc(db, "berita_rw05", id));
    }
  };

  // C. KELOLA ADUAN WARGA REALTIME
  onSnapshot(query(collection(db, "aduan_warga05"), orderBy("createdAt", "desc")), (snapshot) => {
    loadingAdmin.style.display = 'none';
    if (snapshot.empty) {
      listAduanAdmin.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; padding:20px 0;">Belum ada aduan masuk.</div>';
      return;
    }

    let html = '';
    snapshot.forEach((docItem) => {
      const data = docItem.data();
      const id = docItem.id;
      let badgeClass = 'status-menunggu';
      if (data.status === 'Diproses') badgeClass = 'status-proses';
      if (data.status === 'Selesai') badgeClass = 'status-selesai';

      const gpsBtn = (data.latitude && data.longitude) 
        ? `<a href="https://maps.google.com/?q=${data.latitude},${data.longitude}" target="_blank" style="font-size:11px; color:#2563eb; font-weight:700; text-decoration:none;">MAPS (${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)})</a>`
        : '<span style="font-size:11px; color:#94a3b8;">📍 GPS Tidak Ada</span>';

      html += `
        <div class="card-box card-aduan">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
            <div>
              <div style="font-size:13px; font-weight:800; color:#0f172a;">${data.judul || 'Tanpa Judul'}</div>
              <div style="font-size:11px; color:#64748b;">Pelapor: <b>${data.nama || 'Warga'}</b> (${data.rt || 'RT -'})</div>
            </div>
            <span class="badge-status ${badgeClass}">${data.status || 'Menunggu'}</span>
          </div>
          <p style="font-size:12px; color:#334155; margin:8px 0;">${data.deskripsi || ''}</p>
          ${data.fotoBase64 ? `<img src="${data.fotoBase64}">` : ''}
          <div style="margin-bottom:10px;">${gpsBtn}</div>
          <div style="display:flex; gap:6px;">
            <button class="btn-action btn-proses" onclick="updateStatusAduan('${id}', 'Diproses')">Proses</button>
            <button class="btn-action btn-selesai" onclick="updateStatusAduan('${id}', 'Selesai')">Selesai</button>
            <button class="btn-action btn-hapus" onclick="hapusAduan('${id}')">Hapus</button>
          </div>
        </div>
      `;
    });
    listAduanAdmin.innerHTML = html;
  });

  window.updateStatusAduan = async function(docId, statusBaru) {
    await updateDoc(doc(db, "aduan_warga05", docId), { status: statusBaru });
  };

  window.hapusAduan = async function(docId) {
    if (confirm('Hapus laporan ini?')) {
      await deleteDoc(doc(db, "aduan_warga05", docId));
    }
  };
</script>
</body>
</html>
