Name: Build Signed Android APK v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Web Dir and Generate Native Capacitor Android
        run: |
          rm -rf android www
          mkdir -p www
          
          # Copy seluruh aset web penting
          cp -r index.html pages assets www/ 2>/dev/null || true
          
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets || true
          
          # Buat capacitor.config.json lengkap dengan konfigurasi ikon
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA RW05",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "icon": "assets/img/katar-app-icon.png"
            }
          }
          EOF
          
          npx cap add android
          
          # Mengonversi dan memasang ikon secara otomatis dari folder assets/img/katar-app-icon.png
          npx @capacitor/assets generate --icon assets/img/katar-app-icon.png --android
          
          npx cap copy android
          npx cap sync android

      - name: Copy google-services.json for Firebase & Notifications
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json successfully copied to android/app/"
          fi

      - name: Inject Camera & Location Permissions to Manifest
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "Injecting permissions into fresh AndroidManifest.xml..."
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_FILE"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST_FILE"
              echo "Permissions injected successfully!"
            fi
          fi

      - name: Decode Keystore from Secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Fix Kotlin Conflict & Configure Signing
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            cat << 'EOF' >> "$BUILD_GRADLE"

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'PKCS12'
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" dist/katarnolima-rw05-v2.1.apk
          else
            find android/ -name "*.apk" -exec cp {} dist/katarnolima-rw05-v2.1.apk \;
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: dist/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: dist/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
