name: Build Signed Android APK v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies & Prepare Capacitor
        run: |
          cat << 'EOF' > package.json
          {
            "name": "katarnolima-rw05",
            "version": "2.1.0",
            "private": true
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/push-notifications --save-dev
          pip install pillow -q

      - name: Populate Web Assets & Config
        run: |
          mkdir -p www assets
          
          # Salin icon.png dari root ke assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          fi

          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='android' \
                    --exclude='node_modules' \
                    --exclude='www' \
                    ./ www/
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA RW05",
            "webDir": "www",
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF

      - name: Generate Clean Android Platform & Copy Firebase Config
        run: |
          # Hapus folder android yang tidak lengkap lalu buat proyek native segar
          rm -rf android
          npx cap add android

          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json berhasil disalin ke android/app/"
          fi
          
          npx cap sync android

      - name: Force Apply icon.png to All Android Densities
        run: |
          python3 -c "
          import os, glob, shutil
          from PIL import Image

          res_dir = 'android/app/src/main/res'

          # Hapus adaptive icon bawaan Capacitor agar OS Android wajib pakai ic_launcher baru
          anydpi_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          src_path = 'icon.png'
          if not os.path.exists(src_path):
              src_path = 'assets/icon.png'

          if os.path.exists(src_path):
              im = Image.open(src_path).convert('RGBA')

              canvas_size = 2048
              canvas = Image.new('RGBA', (canvas_size, canvas_size), (255, 255, 255, 0))

              target_logo_size = int(canvas_size * 0.65)
              im.thumbnail((target_logo_size, target_logo_size), Image.Resampling.LANCZOS)

              pos_x = (canvas_size - im.width) // 2
              pos_y = (canvas_size - im.height) // 2
              canvas.paste(im, (pos_x, pos_y), im)

              maps = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }

              for folder, px in maps.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  
                  resized_icon = canvas.resize((px, px), Image.Resampling.LANCZOS)
                  
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

              print('Ikon icon.png dari Root Berhasil Dipasang!')
          else:
              print('File icon.png tidak ditemukan!')
          "

      - name: Bump Version to v2.1 in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "versionCode" "$BUILD_GRADLE"; then
              sed -i 's/versionCode [0-9]*/versionCode 2/g' "$BUILD_GRADLE"
              sed -i 's/versionName "[^"]*"/versionName "2.1"/g' "$BUILD_GRADLE"
            else
              sed -i '/defaultConfig {/a \        versionCode 2\n        versionName "2.1"' "$BUILD_GRADLE"
            fi
            echo "Versi v2.1 berhasil diperbarui!"
          fi

      - name: Decode Keystore from Secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Configure Signing & Build Release APK
        working-directory: android
        run: |
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'PKCS12'
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" dist/katarnolima-rw05-v2.1.apk
          else
            find android/ -name "*.apk" -exec cp {} dist/katarnolima-rw05-v2.1.apk \;
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: dist/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: dist/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
