name: Build Signed Android APK v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies & Capacitor CLI
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/push-notifications @capacitor/camera @capacitor/geolocation
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='android' \
                    --exclude='node_modules' \
                    --exclude='www' \
                    ./ www/
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init & Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Camera & Location Permissions
        run: |
          MANIFEST_FILE=$(find android/ -name "AndroidManifest.xml" | head -n 1)
          if [ -f "$MANIFEST_FILE" ]; then
            echo "Injecting permissions into $MANIFEST_FILE..."
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_FILE"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST_FILE"
            fi
          fi

      - name: Apply HD Safe-Zone Icon
        run: |
          python3 -c "
          import os, glob
          from PIL import Image

          possible_paths = ['katar-app-icon.png', 'assets/katar-app-icon.png', 'img/katar-app-icon.png']
          src_path = next((p for p in possible_paths if os.path.exists(p)), None)
          if not src_path:
              exit(0)

          im = Image.open(src_path).convert('RGBA')
          res_dir = next(iter(glob.glob('android/**/main/res', recursive=True)), 'android/app/src/main/res')
          
          canvas_size = 2048
          canvas = Image.new('RGBA', (canvas_size, canvas_size), (255, 255, 255, 0))
          target_logo_size = int(canvas_size * 0.65)
          im.thumbnail((target_logo_size, target_logo_size), Image.Resampling.LANCZOS)
          canvas.paste(im, ((canvas_size - im.width) // 2, (canvas_size - im.height) // 2), im)

          for folder, px in {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized_icon = canvas.resize((px, px), Image.Resampling.LANCZOS)
              resized_icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
          "

      - name: Bump Version to v2.1 in build.gradle
        run: |
          BUILD_GRADLE=$(find android/ -name "build.gradle" | grep "/app/" | head -n 1)
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode 3/g' "$BUILD_GRADLE"
            sed -i 's/versionName "[^"]*"/versionName "2.1"/g' "$BUILD_GRADLE"
          fi

      - name: Decode Keystore from GitHub Secrets
        run: |
          KEYSTORE_DIR="android/app"
          mkdir -p "$KEYSTORE_DIR"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_DIR/release.p12" || true

      - name: Configure Signing in build.gradle
        run: |
          BUILD_GRADLE=$(find android/ -name "build.gradle" | grep "/app/" | head -n 1)
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
              cat << 'EOF' >> "$BUILD_GRADLE"

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'PKCS12'
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
            fi
          fi

      - name: Build Signed Release APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew tidak ditemukan, mencoba generate wrapper..."
            gradle wrapper || true
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          fi

          if [ -n "$GRADLEW_PATH" ]; then
            WORK_DIR=$(dirname "$GRADLEW_PATH")
            echo "Working directory: $WORK_DIR"
            cd "$WORK_DIR"
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Error: Gradle wrapper tidak dapat ditemukan/dibuat!"
            exit 1
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_PATH=$(find . -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/katarnolima-rw05-v2.1.apk
          else
            echo "Error: Still no APK generated!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: dist/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: dist/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
