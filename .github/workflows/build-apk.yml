name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init/Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ganti Icon Aplikasi (HD & Sharp Filter)
        run: |
          python3 -c "
          import os
          from PIL import Image, ImageFilter

          src_path = 'img/logo-resmi-karang-taruna.jpg'
          if not os.path.exists(src_path):
              print('File logo tidak ditemukan!')
              exit(1)

          # Buka gambar asli
          im = Image.open(src_path).convert('RGBA')

          # Terapkan penajaman ringan pada sumber jika ukurannya kecil
          im = im.filter(ImageFilter.DETAIL)

          # Kanvas HD 1024x1024
          size = 1024
          bg = Image.new('RGBA', (size, size), (255, 255, 255, 0))
          
          # Skala 75% dari kanvas agar proporsional
          max_side = int(size * 0.75)
          
          # Resize resolusi tinggi menggunakan Resampling.LANCZOS
          im_resized = im.resize((max_side, max_side), Image.Resampling.LANCZOS)
          bg.paste(im_resized, ((size - max_side) // 2, (size - max_side) // 2), im_resized)

          # Ukuran mipmap Android
          maps = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          res_dir = 'android/app/src/main/res'

          for folder, px in maps.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              
              # Downscale dengan presisi dari sumber HD ke tiap folder mipmap
              o = bg.resize((px, px), Image.Resampling.LANCZOS)
              o = o.filter(ImageFilter.SHARPEN)
              
              o.save(os.path.join(target_dir, 'ic_launcher.png'), quality=100)
              o.save(os.path.join(target_dir, 'ic_launcher_round.png'), quality=100)
              o.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), quality=100)

          print('Ikon HD & Tajam Berhasil Di-generate!')
          "

      - name: Build APK
        working-directory: android
        run: |
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: KATARNOLIMA RW05 v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
