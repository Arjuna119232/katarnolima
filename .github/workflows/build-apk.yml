name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init/Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply HD Safe-Zone Icon
        run: |
          python3 -c "
          import os, glob
          from PIL import Image

          # Pakai file baru: katar-app-icon.png
          src_path = 'img/katar-app-icon.png'
          if not os.path.exists(src_path):
              print('File img/katar-app-icon.png tidak ditemukan!')
              exit(1)

          im = Image.open(src_path).convert('RGBA')

          # 1. Hapus XML adaptive bawaan Capacitor agar tidak nge-zoom paksa
          res_dir = 'android/app/src/main/res'
          for xml_file in glob.glob(f'{res_dir}/mipmap-*/ic_launcher*.xml') + glob.glob(f'{res_dir}/drawable*/ic_launcher*.xml'):
              try:
                  os.remove(xml_file)
              except Exception:
                  pass

          # 2. Buat kanvas HD 2048x2048 transparan
          canvas_size = 2048
          canvas = Image.new('RGBA', (canvas_size, canvas_size), (255, 255, 255, 0))

          # 3. Scale logo ke 65% dari kanvas (Safe Zone agar presisi & tidak kepotong)
          target_logo_size = int(canvas_size * 0.65)
          im.thumbnail((target_logo_size, target_logo_size), Image.Resampling.LANCZOS)

          # 4. Tempel di tengah
          pos_x = (canvas_size - im.width) // 2
          pos_y = (canvas_size - im.height) // 2
          canvas.paste(im, (pos_x, pos_y), im)

          # 5. Generate ke semua folder mipmap Android dengan downscale lanczos HD
          maps = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, px in maps.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              
              resized_icon = canvas.resize((px, px), Image.Resampling.LANCZOS)
              
              resized_icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          print('Ikon katar-app-icon.png Berhasil Diterapkan!')
          "

      - name: Build APK
        working-directory: android
        run: |
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: KATARNOLIMA RW05 v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
