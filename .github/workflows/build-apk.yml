# Build Signed Release v2.1 - Clean Configuration
name: Build Signed Android APK v2.1 Clean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies & Prepare Capacitor
        run: |
          cat << 'EOF' > package.json
          {
            "name": "katarnolima-rw05",
            "version": "2.1.0",
            "private": true
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/push-notifications --save-dev
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='android' \
                    --exclude='node_modules' \
                    --exclude='www' \
                    ./ www/
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA RW05",
            "webDir": "www",
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF

      - name: Init/Sync Android & Copy Firebase Config
        run: |
          npx cap add android || true
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json berhasil disalin ke android/app/"
          fi
          npx cap sync android

      - name: Force Version 2.1 in Android Native
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "versionCode" "$BUILD_GRADLE"; then
              sed -i 's/versionCode [0-9]*/versionCode 2/g' "$BUILD_GRADLE"
              sed -i 's/versionName "[^"]*"/versionName "2.1"/g' "$BUILD_GRADLE"
            else
              sed -i '/defaultConfig {/a \        versionCode 2\n        versionName "2.1"' "$BUILD_GRADLE"
            fi
            echo "Versi v2.1 berhasil diperbarui!"
          fi

      - name: Decode Keystore from Secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Fix Kotlin Conflict & Configure Signing
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            cat << 'EOF' >> "$BUILD_GRADLE"

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'PKCS12'
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" dist/katarnolima-rw05-v2.1.apk
          else
            find android/ -name "*.apk" -exec cp {} dist/katarnolima-rw05-v2.1.apk \;
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: dist/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: dist/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
