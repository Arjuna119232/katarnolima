name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init/Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Ganti Icon Aplikasi
        run: |
          python3 -c "
          import os
          from PIL import Image
          im = Image.open('img/logo-resmi-karang-taruna.jpg').convert('RGBA')
          size = 1024
          bg = Image.new('RGBA', (size, size), (255, 255, 255, 0))
          max_side = int(size * 0.82)
          im.thumbnail((max_side, max_side), Image.LANCZOS)
          bg.paste(im, ((size - im.width) // 2, (size - im.height) // 2), im)
          maps = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, px in maps.items():
              o = bg.resize((px, px), Image.LANCZOS)
              p1 = os.path.join('android/app/src/main/res', folder, 'ic_launcher.png')
              p2 = os.path.join('android/app/src/main/res', folder, 'ic_launcher_round.png')
              o.save(p1)
              o.save(p2)
          print('Icon fixed')
          "

      - name: Build APK
        working-directory: android
        run: |
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: KATARNOLIMA RW05 v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
