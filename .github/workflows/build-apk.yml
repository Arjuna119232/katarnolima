name: Build Signed Android APK v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Build Signed Release APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "gradlew tidak ditemukan di folder android, mencoba menjalankan gradle..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease
            else
              gradle assembleRelease
            fi
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate APK Output
        run: |
          mkdir -p dist
          APK_FILE=$(find android/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" dist/katarnolima-rw05-v2.1.apk
          else
            echo "APK tidak ditemukan setelah build!"
            find android/ -maxdepth 4 -ls || true
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: dist/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: dist/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
