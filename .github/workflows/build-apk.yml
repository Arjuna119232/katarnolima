name: Build KATARNOLIMA APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA RW05",
            "webDir": "www",
            "server": {
              "url": "https://arjuna119232.github.io/katarnolima/",
              "cleartext": true
            }
          }
          JSON
          mkdir -p www
          echo "<h1>Loading KATARNOLIMA</h1>" > www/index.html
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KATARNOLIMA-RW05-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
