name: Build Signed Android APK v2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install
          pip install pillow -q

      - name: Populate Web Assets & Config
        run: |
          mkdir -p www
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='android' \
                    --exclude='node_modules' \
                    --exclude='www' \
                    ./ www/
          echo '{"appId":"com.katarnolima.app","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Sync Capacitor
        run: |
          npx cap sync android || true
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Apply HD Safe-Zone Icon
        run: |
          python3 -c "
          import os, glob
          from PIL import Image

          src_path = 'img/katar-app-icon.png'
          if not os.path.exists(src_path):
              src_path = 'img/logo-hd.png'
          if not os.path.exists(src_path):
              src_path = 'img/logo-resmi-karang-taruna.jpg'

          if os.path.exists(src_path):
              im = Image.open(src_path).convert('RGBA')

              res_dir = 'android/app/src/main/res'
              for xml_file in glob.glob(f'{res_dir}/mipmap-*/ic_launcher*.xml') + glob.glob(f'{res_dir}/drawable*/ic_launcher*.xml'):
                  try:
                      os.remove(xml_file)
                  except Exception:
                      pass

              canvas_size = 2048
              canvas = Image.new('RGBA', (canvas_size, canvas_size), (255, 255, 255, 0))

              target_logo_size = int(canvas_size * 0.65)
              im.thumbnail((target_logo_size, target_logo_size), Image.Resampling.LANCZOS)

              pos_x = (canvas_size - im.width) // 2
              pos_y = (canvas_size - im.height) // 2
              canvas.paste(im, (pos_x, pos_y), im)

              maps = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }

              for folder, px in maps.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  
                  resized_icon = canvas.resize((px, px), Image.Resampling.LANCZOS)
                  
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  resized_icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

              print('Ikon Berhasil Diterapkan!')
          "

      - name: Build APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
