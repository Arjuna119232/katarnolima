name: Build KATARNOLIMA APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install and Build
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA RW05","webDir":"www","server":{"url":"https://arjuna119232.github.io/katarnolima/","cleartext":true}}' > capacitor.config.json
          mkdir -p www
          echo '<h1>KATARNOLIMA RW05 Loading...</h1>' > www/index.html
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KATARNOLIMA-RW05-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
