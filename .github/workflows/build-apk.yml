name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & export env
        run: |
          mkdir -p ~/.android
          echo "count=0.5" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Populate Web Assets into www/
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA",
            "webDir": "www"
          }
          EOF

      - name: Init/Sync Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradlew Executable & Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
