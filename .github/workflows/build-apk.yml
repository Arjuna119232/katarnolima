name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Populate Web Assets
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init/Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: GANTI ICON JADI LOGO RESMI
        run: |
          python3 -c "from PIL import Image; Image.open('img/logo-resmi-karang-taruna.jpg').convert('RGBA').save('icon.png')" || cp img/logo-resmi-karang-taruna.jpg icon.png
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icon.png android/app/src/main/res/$d/ic_launcher.png
            cp icon.png android/app/src/main/res/$d/ic_launcher_round.png
          done

      - name: Fix Kotlin & Build APK
        working-directory: android
        run: |
          sed -i '/kotlin-stdlib/d' app/build.gradle || true
          sed -i '/resolutionStrategy/d' app/build.gradle || true
          sed -i '/configurations.all/d' app/build.gradle || true
          cat << 'EOF' >> app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KATARNOLIMA-RW05-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
