name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Capacitor
        run: |
          npm init -y 2>/dev/null || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Populate Web Assets
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json
      - name: Init Android Project
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
