name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies & Capacitor CLI
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Prepare and sync Capacitor
        run: |
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA RW05","webDir":"www"}' > capacitor.config.json
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/
          cp -r img video www/ 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true
          npx cap add android || true
          npx cap sync android
      - name: Build APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
