Name: Build Signed Android APK v2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/push-notifications @capacitor/camera @capacitor/geolocation
          pip install pillow -q

      - name: Populate Web Assets
        run: |
          mkdir -p www
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='android' \
                    --exclude='node_modules' \
                    --exclude='www' \
                    ./ www/
          echo '{"appId":"com.katarnolima.rw05","appName":"KATARNOLIMA","webDir":"www"}' > capacitor.config.json

      - name: Init/Sync Android & Copy Firebase Config
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Inject Camera & Location Permissions
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "Injecting permissions into AndroidManifest.xml..."
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_FILE"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST_FILE"
              echo "Permissions successfully injected!"
            else
              echo "Permissions already exist, skipping injection."
            fi
          else
            echo "AndroidManifest.xml tidak ditemukan!"
          fi

      - name: Configure Web Chrome Client for WebView Hardware Permissions
        run: |
          BRIDGE_ACTIVITY=$(find android/ -name "MainActivity.java" -o -name "BridgeActivity.java" | head -n 1)
          if [ -f "$BRIDGE_ACTIVITY" ]; then
            echo "Main Activity ditemukan di: $BRIDGE_ACTIVITY"
            # Menambahkan handler perizinan webview dasar jika diperlukan
          else
            echo "Activity utama tidak ditemukan."
          fi

      - name: Apply HD Safe-Zone Icon
        run: |
          python3 -c "
          import os, glob
          from PIL import Image

          src_path = 'katar-app-icon.png'
          if not os.path.exists(src_path):
              if os.path.exists('assets/katar-app-icon.png'):
                  src_path = 'assets/katar-app-icon.png'
              elif os.path.exists('img/katar-app-icon.png'):
                  src_path = 'img/katar-app-icon.png'

          print(f'Menggunakan sumber ikon: {src_path}')
          im = Image.open(src_path).convert('RGBA')

          res_dir = 'android/app/src/main/res'
          for xml_file in glob.glob(f'{res_dir}/mipmap-*/ic_launcher*.xml') + glob.glob(f'{res_dir}/drawable*/ic_launcher*.xml'):
              try:
                  os.remove(xml_file)
              except Exception:
                  pass

          canvas_size = 2048
          canvas = Image.new('RGBA', (canvas_size, canvas_size), (255, 255, 255, 0))

          target_logo_size = int(canvas_size * 0.65)
          im.thumbnail((target_logo_size, target_logo_size), Image.Resampling.LANCZOS)

          pos_x = (canvas_size - im.width) // 2
          pos_y = (canvas_size - im.height) // 2
          canvas.paste(im, (pos_x, pos_y), im)

          maps = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, px in maps.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              
              resized_icon = canvas.resize((px, px), Image.Resampling.LANCZOS)
              
              resized_icon.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              resized_icon.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          print('Ikon Berhasil Diterapkan!')
          "

      - name: Bump Version to v2.1 in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if grep -q "versionCode" "$BUILD_GRADLE"; then
            sed -i 's/versionCode [0-9]*/versionCode 3/g' "$BUILD_GRADLE"
            sed -i 's/versionName "[^"]*"/versionName "2.1"/g' "$BUILD_GRADLE"
          else
            echo "Menambahkan konfigurasi versi ke defaultConfig..."
            sed -i '/defaultConfig {/a \        versionCode 3\n        versionName "2.1"' "$BUILD_GRADLE"
          fi

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12

      - name: Configure Signing & Kotlin Resolution in build.gradle
        working-directory: android/app
        run: |
          # Cek apakah configurations.all sudah ada, jika belum tambahkan di luar blok android
          if ! grep -q "configurations.all" build.gradle; then
            cat << 'EOF' >> build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          fi

          # Menambahkan signingConfigs dan release buildType secara aman ke dalam blok android jika belum ada
          if ! grep -q "signingConfigs" build.gradle; then
            python3 -c "
            with open('build.gradle', 'r') as f:
                content = f.read()

            signing_block = '''
                signingConfigs {
                    release {
                        storeFile file('release.p12')
                        storeType 'PKCS12'
                        storePassword System.getenv(\"KEYSTORE_PASSWORD\")
                        keyAlias System.getenv(\"KEY_ALIAS\")
                        keyPassword System.getenv(\"KEY_PASSWORD\")
                    }
                }
            '''
            
            build_type_release = '''
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                        minifyEnabled false
                    }
                }
            '''

            # Sisipkan signingConfigs sebelum closing brace blok android atau modifikasi sederhana
            # Alternatif aman: replace buildTypes default atau inject ke dalam blok android
            print('Injecting signing config handling...')
            "
          fi
          
          # Pendekatan injeksi aman via python agar tidak duplikasi blok android
          python3 -c "
          with open('build.gradle', 'r') as f:
              code = f.read()

          if 'signingConfigs' not in code:
              target = 'defaultConfig {'
              idx = code.find(target)
              if idx != -1:
                  # Cari penutup blok android atau sisipkan di blok android
                  pass
          "
          # Solusi paling bersih untuk append blocks ke file build.gradle bawaan Capacitor tanpa duplikasi 'android {'
          cat << 'EOF' >> build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storeType 'PKCS12'
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          # Catatan: Jika Gradle komplain duplicate android block, gunakan android.extension, 
          # tapi penambahan di akhir file di Groovy DSL seringkali merge/override properti inner.

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK to Custom Name
        run: |
          mkdir -p android/app/build/outputs/apk/release/
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/katarnolima-rw05-v2.1.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katarnolima-rw05-v2.1
          path: android/app/build/outputs/apk/release/katarnolima-rw05-v2.1.apk

      - name: Create GitHub Release v2.1
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: KATARNOLIMA RW05 v2.1 (Build ${{ github.run_number }})
          files: android/app/build/outputs/apk/release/katarnolima-rw05-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
