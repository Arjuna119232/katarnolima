name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Populate Web Assets into www/
        run: |
          mkdir -p www
          cp index.html script.js style.css berita-gemah-ripah-nusantara.html www/ 2>/dev/null || true
          cp -r img video www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.katarnolima.rw05",
            "appName": "KATARNOLIMA",
            "webDir": "www"
          }
          EOF

      - name: Init/Sync Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Conflict & Build APK via Gradle
        working-directory: android
        run: |
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
